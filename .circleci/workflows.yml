# DO NOT EDIT. This file is generated by `devctl gen circleci` and kept in sync
# by the giantswarm/github align-files workflow. Change the generator in devctl
# (pkg/gen/input/circleci) or the gen.ci config in giantswarm/github, not here.
# Repo-specific jobs and workflows go in .circleci/custom.yml, which the setup
# workflow in .circleci/config.yml merges into this file at pipeline runtime.
version: 2.1
orbs:
  architect: giantswarm/architect@10.16.7

workflows:
  build:
    jobs:
    # Resolve the version once, at the start of the workflow, and persist it to
    # the workspace (.pipeline_version). Every image and chart job requires
    # this job and builds with that version instead of resolving its own, so a
    # stable tag landing while the workflow runs (a promote) cannot give the
    # image and the chart that references it different versions.
    - architect/pin-version:
        name: pin-version
        filters:
          tags:
            only: /^v.*/

    # build-chart: package + lint via app-build-suite and persist the archive
    # (no push). Shared by the branch and tag paths -- branches get build + test
    # only by default.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: build-chart
        app_catalog: control-plane-catalog
        app_catalog_test: control-plane-test-catalog
        chart: prometheus-rules
        # `appVersion` is the version of the packaged application, and this chart
        # packages an app built elsewhere, so that app's version is what
        # Chart.yaml declares. Keep it; the chart version is still stamped.
        override_app_version: false
        push_to_appcatalog: false
        push_to_oci_registry: false
        persist_chart_archive: true
        # The version pin-version persisted (every chart job attaches the
        # workspace for it).
        attach_workspace: true
        requires:
        - pin-version
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Tag: push chart after tests + the gsoci image. Intentionally does NOT
    # depend on sync-china-registry so the chart catalog can publish even if
    # the in-China Aliyun mirror is slow or fails.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-chart-release
        app_catalog: control-plane-catalog
        app_catalog_test: control-plane-test-catalog
        chart: prometheus-rules
        # `appVersion` is the version of the packaged application, and this chart
        # packages an app built elsewhere, so that app's version is what
        # Chart.yaml declares. Keep it; the chart version is still stamped.
        override_app_version: false
        attach_workspace: true
        requires:
        - pin-version
        - build-chart
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
