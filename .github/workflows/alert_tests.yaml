name: alert-test
run-name: run unit and conformance tests

on:
  pull_request:
    # Only run on PRs based on the main branch
    branches:
      - main

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - name: run rules tests
        run: make test-rules
  inhibition-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - name: run inhibition tests
        run: make test-inhibitions
  runbook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - name: Generate giantswarm-release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: giantswarm
          repositories: giantswarm
          permission-contents: read
      - name: Clone intranet repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          repository: giantswarm/giantswarm
          path: giantswarm
          token: ${{ steps.app-token.outputs.token }}
      - name: run runbook tests
        env:
          RUNBOOKS_DIR: ./giantswarm
        run: make test-ci-runbooks
  prometheus-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - name: run pint linter
        run: make pint
  logql-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - name: run logql linter
        run: make logql-lint
