apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: etcdbackup.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: etcdbackup
    rules:
    - alert: ETCDBackupJobFailedOrStuck
      annotations:
        description: '{{`Job {{ $labels.job }} failed or has not been completed for more than 30 minutes.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-backup/
      expr: kube_job_failed{cluster_type="management_cluster",condition="true",job=~"etcd-backup.+"} == 1 or kube_pod_status_phase{cluster_type="management_cluster",phase="Pending",pod=~"etcd-backup.+"} == 1 or kube_job_status_succeeded{cluster_type="management_cluster",job=~"etcd-backup.+"} == 0
      for: 30m
      labels:
        area: kaas
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_outside_working_hours: "true"
        severity: page
        team: tenet
        topic: etcd-backup
    - alert: LatestETCDBackup2DaysOld
      annotations:
        description: '{{`Latest successful ETCD backup for {{ $labels.cluster_id }}/{{ $labels.tenant_cluster_id }} was more than 48h ago.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-backup/
      # Fire for a cluster that is more than 48h old but has had no successful backup in the
      # last 48h. The left side lists clusters older than 48h; "unless" removes the ones that
      # did back up within 48h, leaving the stale or never-backed-up ones.
      expr: count((time() - label_replace(capi_cluster_created, "tenant_cluster_id", "$1", "name", "(.*)")) > 48 * 60 * 60) by (cluster_id, installation, pipeline, provider, tenant_cluster_id) unless count((time() - etcd_backup_latest_success{tenant_cluster_id!="Control Plane"}) < 48 * 60 * 60) by (cluster_id, installation, pipeline, provider, tenant_cluster_id)
      for: 5m
      labels:
        area: kaas
        cancel_if_outside_working_hours: "true"
        severity: page
        team: tenet
        topic: etcd-backup
    - alert: ETCDBackupFailing
      annotations:
        description: '{{`ETCD backups for {{ $labels.cluster_id }}/{{ $labels.tenant_cluster_id }} are being attempted but have not succeeded in the last 24h.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-backup/
      # Fire when the operator is still attempting backups for a cluster (an attempt in the
      # last 24h) but none have succeeded in the last 24h. A cluster that has never backed up
      # successfully has no latest_success metric at all, so "unless" cannot remove it and it
      # fires - this is what a missing backup bucket looks like.
      expr: (time() - etcd_backup_latest_attempt{cluster_type="management_cluster"}) < 24 * 60 * 60 unless on (cluster_id, installation, pipeline, provider, tenant_cluster_id) (time() - etcd_backup_latest_success{cluster_type="management_cluster"}) < 24 * 60 * 60
      for: 1h
      labels:
        area: kaas
        cancel_if_outside_working_hours: "true"
        cancel_if_metrics_broken: "true"
        severity: page
        team: tenet
        topic: etcd-backup
    - alert: ETCDBackupMetricsMissing
      annotations:
        description: '{{`ETCD backup metrics are missing`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-backup/
      expr: absent(etcd_backup_latest_attempt{cluster_type="management_cluster", cluster_id="{{ .Values.managementCluster.name }}", installation="{{ .Values.managementCluster.name }}", provider="{{ .Values.managementCluster.provider.kind }}", pipeline="{{ .Values.managementCluster.pipeline }}"})
      for: 12h
      labels:
        area: kaas
        cancel_if_outside_working_hours: "true"
        cancel_if_metrics_broken: "true"
        severity: page
        team: tenet
        topic: etcd-backup
