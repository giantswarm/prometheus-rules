apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: kube-state-metrics.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: kube-state-metrics
    rules:
    - alert: KubeStateMetricsDown
      annotations:
        description: '{{`KubeStateMetrics is down.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: |-
        count by (cluster_id, installation, provider, pipeline) (
          up{job="kube-state-metrics", endpoint="http"}
        ) == 0
        or (
          label_replace(
            capi_cluster_status_condition{type="ControlPlaneReady", status="True"},
            "cluster_id",
            "$1",
            "name",
            "(.*)"
          ) == 1
        )
        unless on (cluster_id) (
          count by (cluster_id) (up{job="kube-state-metrics", endpoint="http"} == 1)
        )
      for: 15m
      labels:
        area: platform
        cancel_if_cluster_control_plane_unhealthy: "true"
        cancel_if_cluster_has_no_workers: "true"
        inhibit_kube_state_metrics_down: "true"
        cancel_if_monitoring_agent_down: "true"
        cancel_if_kubelet_down: "true"
        cancel_if_outside_working_hours: "true"
        severity: page
        team: atlas
        topic: observability
    - alert: KubeStateMetricsSlow
      annotations:
        description: '{{`KubeStateMetrics is too slow.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{handler="metrics", job="kube-state-metrics"}[5m])) by (le, cluster_id, installation, provider, pipeline)) > 15
      for: 15m
      labels:
        area: platform
        cancel_if_cluster_control_plane_unhealthy: "true"
        cancel_if_cluster_has_no_workers: "true"
        inhibit_kube_state_metrics_down: "true"
        cancel_if_kubelet_down: "true"
        cancel_if_outside_working_hours: "true"
        severity: page
        team: atlas
        topic: observability
    - alert: KubeStateMetricsNotRetrievingMetrics
      annotations:
        description: '{{`KubeStateMetrics is not retrieving metrics.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: |-
        # When it looks up but we don't have metrics.
        # `kube_pod_status_phase` is standard and one of the main KSM metrics, and a small cluster has around 600 of these.
        count(kube_pod_status_phase{job="kube-state-metrics"}) by (cluster_id, installation, provider, pipeline) <= 100
      for: 20m
      labels:
        area: platform
        cancel_if_cluster_control_plane_unhealthy: "true"
        cancel_if_cluster_has_no_workers: "true"
        inhibit_kube_state_metrics_down: "true"
        cancel_if_kubelet_down: "true"
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_outside_working_hours: "true"
        severity: page
        team: atlas
        topic: observability
    ## Same condition as the KSM health alerts, but triggers inhibition earlier and does not page.
    ## `count` carries no threshold on purpose: an inhibition source that fires permanently would
    ## silently swallow every dependent page, which a `<= 100` style threshold would do on a small
    ## cluster. Partial degradation stays with KubeStateMetricsNotRetrievingMetrics.
    - alert: InhibitionKubeStateMetricsDown
      annotations:
        description: '{{`KubeStateMetrics is not serving data for cluster {{ $labels.cluster_id }}.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: |-
        count by (cluster_id, installation, provider, pipeline) (
          label_replace(
            capi_cluster_status_condition{type="ControlPlaneReady", status="True"} == 1,
            "cluster_id",
            "$1",
            "name",
            "(.*)"
          )
        )
        unless on (cluster_id) (
          count by (cluster_id) (kube_pod_status_phase{job="kube-state-metrics"})
        )
      for: 2m
      labels:
        area: platform
        inhibit_kube_state_metrics_down: "true"
        severity: none
        team: atlas
        topic: observability
    ## One alert for the whole set: a cluster only clears it when every expected metric is present,
    ## so both a single missing resource kind and a total loss are covered. `count by` on the anchor
    ## keeps scrape-target labels out of the alert's identity.
    {{- $ksmMetrics := list "kube_configmap_created" "kube_daemonset_created" "kube_deployment_created"
        "kube_endpoint_created" "kube_namespace_created" "kube_node_created" "kube_pod_created"
        "kube_replicaset_created" "kube_secret_created" "kube_service_created" }}
    - alert: KubeStateMetricsMetricsMissing
      annotations:
        description: '{{`At least one kube-state-metrics resource metric is missing for cluster {{ $labels.cluster_id }}.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: |-
        count by (cluster_id, installation, provider, pipeline) (
          label_replace(
            capi_cluster_status_condition{type="ControlPlaneReady", status="True"} == 1,
            "cluster_id",
            "$1",
            "name",
            "(.*)"
          )
        )
        unless on (cluster_id) (
          count by (cluster_id) (
            count by (cluster_id, __name__) (
              {__name__=~"{{ join "|" $ksmMetrics }}", job="kube-state-metrics"}
            )
          ) == {{ len $ksmMetrics }}
        )
      for: 30m
      labels:
        area: platform
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_outside_working_hours: "true"
        severity: page
        team: atlas
        topic: kubernetes
