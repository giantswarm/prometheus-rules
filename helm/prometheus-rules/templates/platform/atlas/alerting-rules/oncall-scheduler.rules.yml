apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: oncall-scheduler.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: oncall-scheduler
    rules:
    - alert: OncallSchedulerCronJobFailed
      annotations:
        description: '{{`The last run of CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} did not succeed.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/oncall-scheduler-cronjob-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'      # The alert has no static team label. Each team runs its own scheduler, and
      # the team comes from the application.giantswarm.io/team label of the CronJob.
      # A CronJob that never succeeded is compared against its creation time.
      # Failed Jobs stay in the Job history after a later run succeeds, so the
      # alert compares the CronJob timestamps to resolve on the next success.
      # The max aggregations drop the kube-state-metrics pod labels: two
      # kube-state-metrics pods overlap during a rollout, and the joins need
      # one series per CronJob.
      expr: |
        (
          max by (cluster_id, cluster_type, customer, installation, organization, pipeline, provider, region, namespace, cronjob) (
            kube_cronjob_status_last_schedule_time
          )
          * on (cluster_id, installation, namespace, cronjob) group_left (team)
          max by (cluster_id, installation, namespace, cronjob, team) (
            label_replace(
              kube_cronjob_labels{label_app_kubernetes_io_name="area-oncall-scheduler", label_application_giantswarm_io_team!=""},
              "team", "$1", "label_application_giantswarm_io_team", "(.+)"
            )
          )
        )
        > on (cluster_id, installation, namespace, cronjob) group_left ()
        max by (cluster_id, installation, namespace, cronjob) (
          kube_cronjob_status_last_successful_time
          or
          kube_cronjob_created
        )
      # A run in progress also has a schedule time after the last success.
      # A scheduler run should finish in minutes, so a run still in progress after 2h is
      # hung, and it blocks the next runs (concurrencyPolicy: Forbid). On the
      # hourly calendar sync, 2h needs two failed runs in a row.
      for: 2h
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: notify
        topic: oncall
