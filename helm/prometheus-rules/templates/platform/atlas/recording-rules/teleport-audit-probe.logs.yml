apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    {{- include "labels.common" . | nindent 4}}
  name: teleport-audit-probe.logs.rules
  namespace: {{ .Values.namespace }}
spec:
  groups:
    - name: teleport-audit-probe.logs
      rules:
        # Counts audit events produced by the audit-pipeline-probe bot, per
        # source cluster, as ingested by this installation's Loki. The metric
        # is remote-written to Mimir; its absence for a cluster is the
        # delivery-failure signal (see TeleportAuditProbeMissing).
        - record: giantswarm:teleport_audit:probe_events:count_45m
          expr: |
            sum by (cluster_id, installation, pipeline, provider) (
              count_over_time(
                {scrape_job="teleport.giantswarm.io"}
                  |= "bot-audit-pipeline-probe"
                  | json
                  | fields_user = "bot-audit-pipeline-probe"
                [45m]
              )
            )
