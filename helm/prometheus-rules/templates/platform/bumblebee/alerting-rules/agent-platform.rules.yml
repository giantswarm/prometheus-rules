apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: agent-platform.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: agent-platform
    rules:
    # Agent platform availability alerts (team Bumblebee).
    #
    # The agent platform runs on Giant Swarm's own management clusters, some of
    # which sit in the `testing` pipeline (graveler). Alertmanager only pages a
    # `testing` installation for alerts that carry `all_pipelines: "true"`. The
    # generic alerts that already watch these components — honeybadger's
    # `FluxGiantswarmHelmReleaseFailed` and atlas' `DeploymentNotSatisfiedBumblebee`
    # — do not carry it, so on a `testing` installation they only reach Slack.
    # The alerts below carry `all_pipelines` and step back wherever the generic
    # alert pages (`pipeline` stable or stable-testing), so one stuck component
    # never opens two incidents.
    #
    # Ownership is derived from the metric, not hardcoded: team-stamper copies
    # the chart's `io.giantswarm.application.team` annotation onto every
    # HelmRelease as `application.giantswarm.io/team`, and flux-ksm exposes it
    # as the `team` label of `gotk_resource_info`. Every HelmRelease rendered by
    # the agent-platform meta chart (agentgateway, kagent,
    # agent-platform-connectivity, agent-platform-mcps, muster, klaus-gateway,
    # valkey, dicebear) and the stand-alone ones in flux-giantswarm (tunnelport,
    # mcp-kubernetes, mcp-capi, sre-agent, backstage) resolve to bumblebee.
    #
    # The alerts aggregate the exporter's series down to the labels that
    # routing, the description and the runbook URL use. Scrape-target labels
    # such as `pod` and `instance` would otherwise be part of the alert's
    # identity, and every replacement of the flux-ksm or kube-state-metrics
    # pod would resolve the alert and open a new one. `max by` rather than
    # `max without`, so that a new exporter label cannot creep back in.
    - alert: AgentPlatformHelmReleaseNotReady
      annotations:
        description: '{{`Agent platform HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} on {{ $labels.installation }} has not been Ready for over an hour.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/agent-platform-helmrelease-not-ready/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.exported_namespace }}&HELMRELEASE_NAME={{ $labels.name }}`}}'
        __dashboardUid__: agent-platform-overview
        dashboardQueryParams: "orgId=1"
      expr: |
        max by (cluster_id, cluster_type, installation, pipeline, provider, exported_namespace, name, team, ready) (
          gotk_resource_info{job="flux-ksm", ready="False", customresource_kind="HelmRelease", cluster_type="management_cluster", exported_namespace="flux-giantswarm", team="bumblebee"}
        ) > 0
        unless on (cluster_id, exported_namespace, name)
        ALERTS{alertname="FluxGiantswarmHelmReleaseFailed", team="bumblebee", pipeline=~"stable|stable-testing"}
      for: 1h
      labels:
        all_pipelines: "true"
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: bumblebee
        topic: agent-platform
    # kagent-controller is the control plane of the agent platform: it serves
    # the kagent API and UI and reconciles Agent, ModelConfig and session
    # resources. Zero available replicas means agents on the installation are
    # down. A Deployment scaled to zero on purpose does not fire.
    - alert: KagentControllerDown
      annotations:
        description: '{{`kagent-controller in {{ $labels.namespace }} on {{ $labels.installation }} has had no available replica for 30 minutes; agents on this installation are down.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kagent-controller-down/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
        __dashboardUid__: agent-platform-overview
        dashboardQueryParams: "orgId=1"
      expr: |
        max by (cluster_id, cluster_type, installation, pipeline, provider, namespace, deployment) (
          kube_deployment_status_replicas_available{cluster_type="management_cluster", namespace="kagent", deployment="kagent-controller"}
        ) == 0
        and on (cluster_id, namespace, deployment)
        kube_deployment_spec_replicas{cluster_type="management_cluster", namespace="kagent", deployment="kagent-controller"} > 0
        unless on (cluster_id, namespace, deployment)
        ALERTS{alertname="DeploymentNotSatisfiedBumblebee", pipeline=~"stable|stable-testing"}
      for: 30m
      labels:
        all_pipelines: "true"
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: bumblebee
        topic: agent-platform
    # kagent keeps its state in a CloudNativePG cluster (kagent/kagent-pg). The
    # instance metrics (cnpg_*) vanish together with the instance pods, so this
    # alert reads the Cluster's status phase from kube-state-metrics' custom
    # resource state instead. The phase is aggregated away so that a cluster
    # moving between unhealthy phases still accumulates the 30 minutes.
    - alert: AgentPlatformPostgresClusterNotHealthy
      annotations:
        description: '{{`CloudNativePG cluster {{ $labels.namespace }}/{{ $labels.name }} on {{ $labels.installation }} has not been in a healthy phase for 30 minutes.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cnpg-cluster-not-healthy/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}&NAME={{ $labels.name }}`}}'
        __dashboardUid__: agent-platform-overview
        dashboardQueryParams: "orgId=1"
      expr: |
        sum by (cluster_id, installation, pipeline, provider, namespace, name) (
          kube_cnpg_cluster_info{cluster_type="management_cluster", namespace=~"agent-platform|kagent", phase!="Cluster in healthy state"}
        ) > 0
      for: 30m
      labels:
        all_pipelines: "true"
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: bumblebee
        topic: agent-platform
    # A platform component that restarts repeatedly is an outage between the
    # restarts: every component is a single replica, and the HelmRelease and
    # Deployment stay "Ready" enough that the alerts above never fire. The
    # generic ManagementClusterContainerIsRestartingTooFrequently sees the same
    # restarts but notifies team Rocket only (gazelle 2026-09-14: muster-valkey
    # was OOM-killed 19 times in 90 minutes, the muster connector was down,
    # nobody in Bumblebee was alerted — giantswarm/giantswarm#37779). Summed
    # per container across the pods of a namespace: a pod replaced mid-loop
    # starts its counter at zero, and the sum keeps counting where the old
    # pod's series stops. The platform's namespaces hold platform pods only —
    # agents are actors inside Substrate's worker pods, not containers of
    # their own — so nothing here is a user's crashing agent.
    - alert: AgentPlatformContainerRestartingTooOften
      annotations:
        description: '{{`Container {{ $labels.container }} in {{ $labels.namespace }} on {{ $labels.installation }} has restarted {{ printf "%.0f" $value }} times in the last hour.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/agent-platform-container-restarting/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}&CONTAINER={{ $labels.container }}`}}'
        __dashboardUid__: agent-platform-overview
        dashboardQueryParams: "orgId=1"
      expr: |
        sum by (cluster_id, cluster_type, installation, pipeline, provider, namespace, container) (
          increase(kube_pod_container_status_restarts_total{cluster_type="management_cluster", namespace=~"agent-platform|kagent|mcp-kubernetes|mcp-capi|mcp-prometheus"}[1h])
        ) > 5
      for: 15m
      labels:
        all_pipelines: "true"
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: bumblebee
        topic: agent-platform
    # The platform's Valkeys — muster-valkey (muster's OAuth token and session
    # store) and the MCP servers' token stores — run with a maxmemory and
    # volatile-lru (giantswarm/agent-platform#446): above the bound Valkey
    # evicts TTL-carrying keys instead of growing, and every eviction costs a
    # person a sign-in or muster a re-list. This is the heads-up before that
    # starts, to Slack. A Valkey without a bound (maxmemory 0) has no
    # redis_memory_max_bytes above zero and is not covered here — the
    # restart alert catches it when it dies. One alert per Valkey: `job` names
    # the instance and survives a pod replacement, `pod` does not.
    - alert: AgentPlatformValkeyMemoryHigh
      annotations:
        description: '{{`Valkey {{ $labels.job }} on {{ $labels.installation }} uses {{ $value | humanizePercentage }} of its maxmemory; above it Valkey evicts tokens and sessions.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/agent-platform-valkey-memory-high/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
        __dashboardUid__: agent-platform-overview
        dashboardQueryParams: "orgId=1"
      expr: |
        max by (cluster_id, cluster_type, installation, pipeline, provider, namespace, job) (
          redis_memory_used_bytes{cluster_type="management_cluster", namespace=~"agent-platform|mcp-kubernetes|mcp-capi|mcp-prometheus"}
          /
          (redis_memory_max_bytes{cluster_type="management_cluster", namespace=~"agent-platform|mcp-kubernetes|mcp-capi|mcp-prometheus"} > 0)
        ) > 0.9
      for: 15m
      labels:
        all_pipelines: "true"
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: notify
        team: bumblebee
        topic: agent-platform
    # muster keeps who is signed in where and what each session may see in
    # its session auth and capability stores. The platform configures them on
    # muster-valkey so they outlive a muster restart and are visible to the
    # admin UI and to an operator; in memory they die with the pod. Since
    # muster 5.19.13 a Valkey that is late at start-up is waited for and one
    # that stays away fails the start (giantswarm/muster#1229), so a muster
    # that reports the memory backend on an installation is either configured
    # for memory -- a misconfiguration of the platform -- or a regression of
    # that fix. Either way a person has to look, in business hours: nothing is
    # down, but every restart of that pod signs everybody out.
    - alert: AgentPlatformMusterSessionStoresInMemory
      annotations:
        description: '{{`muster in {{ $labels.namespace }} on {{ $labels.installation }} runs its session auth and capability stores in memory instead of Valkey: the sessions lose their SSO state and tool views with the pod, and nothing outside the pod can see them.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/agent-platform-muster-session-stores-in-memory/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
        __dashboardUid__: agent-platform-overview
        dashboardQueryParams: "orgId=1"
      expr: |
        max by (cluster_id, cluster_type, installation, pipeline, provider, namespace) (
          muster_session_store_backend{cluster_type="management_cluster", backend="memory"}
        ) == 1
      for: 15m
      labels:
        all_pipelines: "true"
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: bumblebee
        topic: agent-platform
