apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: coding-agents.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: coding-agents
    rules:
    # Coding agents (team Bumblebee): the signals that tell whether one of
    # the kill switches in the runbook is needed. The alerts notify only:
    # deciding to switch agents off is a person's call, in working hours,
    # and without `all_pipelines` no PagerDuty route matches a notify.
    #
    # Agents run as actors in Substrate, and every request an actor makes to
    # the outside goes through Substrate's egress gateway (`atenet-egress` in
    # ate-system), an agentgateway dataplane whose ext_proc checks the host
    # against the actor's egress policy and answers a host outside it with a
    # 403 of its own. The gateway's request counter records that answer with
    # the reason `Authorization`; a 403 an upstream answers itself carries
    # `Upstream` and is not a denial, so the selector excludes `Upstream`
    # rather than naming one reason. The counter carries no actor, Atespace
    # or agent, and the gateway logs no line for a refusal, so the alert is
    # per installation and does not say who tried which host.
    #
    # Any denial is worth a look: an origin the agent's toolchain needs and
    # its policy lacks, or something steering the agent to send data out. A
    # status series is born with its first sample, which increase() cannot
    # see, so the second clause catches a series that did not exist fifteen
    # minutes ago, matched on the pod and the route so that a scrape-target
    # label changing value does not make an old series look new.
    - alert: AgentPlatformSandboxEgressDenied
      annotations:
        description: '{{`The egress gateway in {{ $labels.namespace }} on {{ $labels.installation }} refused {{ printf "%.0f" $value }} requests of agent sandboxes to hosts outside their egress policy in the last fifteen minutes.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/coding-agents-kill-switch/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
        __dashboardUid__: agent-platform-overview
        dashboardQueryParams: "orgId=1"
      expr: |
        sum by (cluster_id, cluster_type, installation, pipeline, provider, namespace) (
          increase(agentgateway_requests_total{cluster_type="management_cluster", namespace="ate-system", job=~".*atenet-egress", status="403", reason!="Upstream"}[15m])
        ) > 0
        or
        sum by (cluster_id, cluster_type, installation, pipeline, provider, namespace) (
          agentgateway_requests_total{cluster_type="management_cluster", namespace="ate-system", job=~".*atenet-egress", status="403", reason!="Upstream"}
          unless on (cluster_id, namespace, pod, listener, route, method, reason)
          agentgateway_requests_total{cluster_type="management_cluster", namespace="ate-system", job=~".*atenet-egress", status="403", reason!="Upstream"} offset 15m
        ) > 0
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: notify
        team: bumblebee
        topic: agent-platform
