apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: cilium.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: cilium
    rules:
    - alert: CiliumBPFMapAlmostFull
      annotations:
        description: '{{`Cilium BPF map {{ $labels.map_name }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is over 80% full.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cilium-bpf-map/
      expr: avg(cilium_bpf_map_pressure) by (cluster_id, installation, pipeline, provider, map_name) * 100 > 80
      for: 15m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: cilium
    - alert: CiliumBPFMapFull
      annotations:
        description: '{{`Cilium BPF map {{ $labels.map_name }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is over 95% full.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cilium-bpf-map/
      expr: avg(cilium_bpf_map_pressure) by (cluster_id, installation, pipeline, provider, map_name) * 100 > 95
      for: 15m
      labels:
        area: platform
        severity: page
        team: cabbage
        topic: cilium
    - alert: CiliumAPITooSlow
      annotations:
        description: '{{`Cilium API calls on {{ $labels.pod }} ({{ $labels.node }}) take over 50s: {{ $labels.method }} {{ $labels.path }}.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cilium-performance-issues/#slow-cilium-api
      expr: avg(rate(cilium_agent_api_process_time_seconds_sum{}[5m])/rate(cilium_agent_api_process_time_seconds_count{}[5m]) > 50) by (cluster_id, node, pod, method, path, installation, pipeline, provider)
      for: 20m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: cilium
    - alert: CiliumAgentKubernetesAPICallsFailing
      annotations:
        description: '{{`Cilium agent on {{ $labels.installation }}/{{ $labels.cluster_id }} node {{ $labels.node }} fails most of its Kubernetes API calls. Its Service table may be stale.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cilium-troubleshooting/
      # A failing node stays Ready when its kubelet talks to the local apiserver, so this is the
      # only signal that the agent stopped receiving Service and endpoint updates.
      expr: |-
        sum(rate(cilium_k8s_client_api_calls_total{return_code=~"<error>|5.."}[5m])) by (cluster_id, installation, node, pipeline, provider)
          /
        sum(rate(cilium_k8s_client_api_calls_total[5m])) by (cluster_id, installation, node, pipeline, provider)
          > 0.5
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: cilium
    - alert: CiliumPolicyDropsIncreased
      annotations:
        description: '{{`Cilium on {{ $labels.installation }}/{{ $labels.cluster_id }} drops {{ $value | humanize }} {{ $labels.direction }} packets per second because of network policies, a jump over the day before, while the clusterwide deny is on.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cilium-troubleshooting/
      # With the clusterwide default deny of network-policies-app, a missing allow shows up as
      # policy drops within minutes. We deliberately don't use Cilium's policy audit mode, so
      # this alert is how we notice.
      # Policy drops are normal on most clusters because of customers' own policies, so the
      # rate is compared with the day before, and only on clusters that have the deny on.
      # The baseline is offset by a day so the jump stays out of it: the alert stays firing for
      # about a day instead of clearing after an hour.
      # A cluster without a baseline (no policy drops before) counts as a jump. While no cluster
      # has a baseline yet, for a day after these rules are deployed, the alert stays quiet.
      # The factor of 10 and the floor of 1/s come from a 7-day backtest across installations.
      # The drop metric has no namespace, so a customer workload without allows fires this too.
      # The deny gate looks back 10m so a kube-state-metrics restart doesn't reset the alert.
      expr: |-
        (
          cluster:cilium_policy_drops:rate5m > 1
          unless
          cluster:cilium_policy_drops:rate5m <= 10 * (cluster:cilium_policy_drops:rate5m_avg1d offset 1d)
          unless on ()
          absent(cluster:cilium_policy_drops:rate5m_avg1d offset 1d)
        )
        and on (cluster_id, installation)
        max by (cluster_id, installation) (max_over_time(kube_cilium_clusterwidenetworkpolicy_info{name="default-deny-all-namespaces"}[10m]))
      for: 10m
      labels:
        area: platform
        cancel_if_cluster_control_plane_unhealthy: "true"
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: cilium
    - alert: NetworkPolicyDenyOptOutOnGiantSwarmNamespace
      annotations:
        description: '{{`Namespace {{ $labels.namespace }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is opted out of the clusterwide network policy deny.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cilium-troubleshooting/
      # The opt-out label takes a namespace out of the clusterwide deny. On kube-system and
      # giantswarm it removes the deny from Giant Swarm components. Not limited to clusters with
      # the deny on: the label does nothing until then, and leaves the namespaces open once the
      # deny is turned on. Aggregated and looking back 10m so a kube-state-metrics restart or
      # pod move doesn't resolve and re-page the alert.
      expr: |-
        max by (cluster_id, cluster_type, installation, pipeline, provider, namespace) (
          max_over_time(kube_namespace_labels{namespace=~"kube-system|giantswarm", label_policy_giantswarm_io_default_deny="false"}[10m])
        ) > 0
      for: 5m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        cancel_if_kube_state_metrics_down: "true"
        severity: page
        team: cabbage
        topic: cilium
    - alert: CiliumNetworkPolicyFailed
      annotations:
        description: '{{`Cilium is failing to import network policies on {{ $labels.installation }}/{{ $labels.cluster_id }}.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/unsupported-cilium-network-policy/
      # cilium_policy_change_total - for cilium >=1.15
      # cilium_policy_import_errors_total - for cilium <1.15
      expr: max(rate(cilium_policy_change_total{outcome=~"fail.*"}[20m]) OR rate(cilium_policy_import_errors_total[20m])) by (cluster_id, installation, pipeline, provider) > 0
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: cilium
    - alert: FluxHelmReleaseFailed
      annotations:
        description: |-
          {{`Flux HelmRelease {{ $labels.name }} in ns {{ $labels.exported_namespace }} on {{ $labels.installation }}-{{ $labels.cluster_id }} is stuck in Failed state.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-helmrelease-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.exported_namespace }}&HELMRELEASE_NAME={{ $labels.name }}`}}'
      expr: gotk_resource_info{ready="False", customresource_kind="HelmRelease", cluster_type="management_cluster", exported_namespace!="flux-giantswarm", exported_namespace!~"org-t-.*", name=~".*(cilium|network-policies)"} > 0
      for: 1h10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_monitoring_agent_down: "true"
        severity: page
        team: cabbage
        topic: cilium
        namespace: |-
          {{`{{ $labels.exported_namespace }}`}}
    - alert: CiliumAgentPodPending
      annotations:
        description: '{{`Pod {{ $labels.namespace }}/{{ $labels.pod }} is stuck in Pending in cluster {{ $labels.installation }}/{{ $labels.cluster_id }}.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/pod-stuck-in-pending/
      expr: kube_pod_status_phase{namespace="kube-system",pod=~"(cilium-.*)",phase="Pending"} == 1
      for: 15m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_cluster_has_no_workers: "true"
        severity: page
        team: cabbage
        topic: cilium
    - alert: CiliumOperatorPodRestartingTooOften
      annotations:
        description: '{{`cilium-operator is restarting too often in cluster {{ $labels.installation }}/{{ $labels.cluster_id }}.`}}'
        runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cilium-troubleshooting/
      expr: 1 - sum(increase(kube_pod_container_status_restarts_total{container="cilium-operator"}[10m])) by (container, cluster_id, cluster_type, customer, installation, pipeline, provider, region)/100 < 0.98
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_cluster_has_no_workers: "true"
        severity: page
        team: cabbage
        topic: cilium
    - alert: CiliumHubbleTLSCertificateWillExpireSoon
      annotations:
        description: '{{`Hubble TLS certificate {{ $labels.secretkey }} in Secret {{ $labels.exported_namespace }}/{{ $labels.name }} on {{ $labels.installation }}/{{ $labels.cluster_id }} expires in less than 30 days.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cilium-hubble-tls-certificates/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      # Covers leaf certs (tls.crt) and the embedded Cilium CA copy (ca.crt) in the hubble secrets.
      # With the cronJob renewal method leafs are re-issued every 4 months with 12 months validity,
      # so anything closer than 30 days to expiry means renewal is broken (or the cluster is still
      # on the legacy helm method, which never renews).
      expr: (cert_exporter_secret_not_after{name=~"hubble-server-certs|hubble-relay-client-certs|hubble-relay-server-certs|hubble-ui-client-certs"} - time()) < 30 * 24 * 60 * 60
      for: 5m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: cilium
    - alert: CiliumHubbleCertificateRenewalJobFailed
      annotations:
        description: '{{`Hubble certificate renewal job {{ $labels.namespace }}/{{ $labels.job_name }} on {{ $labels.installation }}/{{ $labels.cluster_id }} failed.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cilium-hubble-tls-certificates/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: kube_job_failed{namespace="kube-system", job_name=~"hubble-generate-certs.*", condition="true"} == 1
      for: 15m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        cancel_if_kube_state_metrics_down: "true"
        severity: page
        team: cabbage
        topic: cilium
