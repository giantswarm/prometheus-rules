apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: envoy-gateway.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: envoy-gateway
    rules:
    - alert: EnvoyGatewayDeploymentNotSatisfied
      annotations:
        description: '{{`Envoy Gateway Deployment {{ $labels.namespace}}/{{ $labels.deployment }} is not satisfied.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/deployment-not-satisfied/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}&KIND=deployment&NAME={{ $labels.deployment }}`}}'
      expr: kube_deployment_status_replicas_available{namespace="envoy-gateway-system", deployment="envoy-gateway"} / (kube_deployment_status_replicas_available{namespace="envoy-gateway-system", deployment="envoy-gateway"} + kube_deployment_status_replicas_unavailable{namespace="envoy-gateway-system", deployment="envoy-gateway"}) * 100 <= 50
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: {{ include "workingHoursOnly" . }}
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyProxyDeploymentNotSatisfied
      annotations:
        description: '{{`Envoy Proxy Deployment {{ $labels.namespace}}/{{ $labels.deployment }} is not satisfied.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/deployment-not-satisfied/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}&KIND=deployment&NAME={{ $labels.deployment }}`}}'
      expr: envoy_proxy_deployment_status_replicas_available / (envoy_proxy_deployment_status_replicas_available + envoy_proxy_deployment_status_replicas_unavailable) * 100 <= 50
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: {{ include "workingHoursOnly" . }}
        severity: page
        team: cabbage
        topic: envoy-gateway
    # - alert: EnvoyHighDownstreamHTTP5xxErrorRate
    #   annotations:
    #     description: '{{`More than 5% of downstream HTTP responses are 5xx on {{ $labels.pod }} ({{ $value | printf "%.1f" }}%)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}`}}'
    #     runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
    #   expr: |
    #     sum(
    #       rate(envoy_http_downstream_rq_xx{envoy_response_code_class="5"}[5m])
    #     ) by (pod, namespace, cluster_id, installation, pipeline, provider)
    #       /
    #     sum(
    #       rate(envoy_http_downstream_rq_completed[5m])
    #     ) by (pod, namespace, cluster_id, installation, pipeline, provider)
    #     * 100 > 5
    #     and sum(
    #       rate(envoy_http_downstream_rq_completed[5m])
    #     ) by (pod, namespace, cluster_id, installation, pipeline, provider) > 0
    #   for: 10m
    #   labels:
    #     area: platform
    #     cancel_if_outside_working_hours: "true"
    #     severity: page
    #     team: cabbage
    #     topic: envoy-gateway
    # - alert: EnvoyHighClusterUpstream5xxErrorRate
    #   annotations:
    #     description: '{{`More than 5% of upstream requests return 5xx in cluster {{ $labels.envoy_cluster_name }} on {{ $labels.pod }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}`}}'
    #     runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
    #   expr: | 
    #     rate(
    #       envoy_cluster_upstream_rq_xx{envoy_response_code_class="5"}[5m]
    #     ) 
    #       / 
    #     rate(
    #       envoy_cluster_upstream_rq_completed[5m]
    #     ) 
    #     * 100 > 5 
    #     and rate(
    #       envoy_cluster_upstream_rq_completed[5m]
    #     ) > 0
    #   for: 10m
    #   labels:
    #     area: platform
    #     cancel_if_outside_working_hours: "true"
    #     severity: page
    #     team: cabbage
    #     topic: envoy-gateway
    - alert: EnvoyHighDownstreamRequestTimeoutRate
      annotations:
        description: '{{`More than 10% of downstream requests timeout for gateway {{ $labels.gateway_name }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: |
        sum(
          envoy_http_downstream_rq_timeout
        ) by (gateway_name, namespace, cluster_id, installation, pipeline, provider)
          /
        sum(
          envoy_http_downstream_rq_completed
        ) by (gateway_name, namespace, cluster_id, installation, pipeline, provider)
        * 100 > 10
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyClusterCircuitBreakerTripped
      annotations:
        description: '{{`Circuit breaker is open for cluster {{ $labels.envoy_cluster_name }} on {{ $labels.pod }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: envoy_cluster_circuit_breakers_cx_open == 1 or envoy_cluster_circuit_breakers_rq_open == 1
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyControllerNotReconcilingGateway
      annotations:
        description: '{{`Envoy Gateway controller is having issues reconciling {{ $labels.name }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: | 
          # Option A: accepted but config never reached the proxy
          (gatewayapi_gateway_status{type="Accepted", namespace="envoy-gateway-system"} == 1)
            and on(name, namespace, cluster_id, installation, pipeline, provider)
          (gatewayapi_gateway_status{type="Programmed", namespace="envoy-gateway-system"} == 0)
          or
          # Option B: controller rejected the resource entirely
          (gatewayapi_gateway_status{type="Accepted", namespace="envoy-gateway-system"} == 0)
            and on(name, namespace, cluster_id, installation, pipeline, provider) (
              (time() - gatewayapi_gateway_created{namespace="envoy-gateway-system"}) > 120
            )
          or
          # Option C: stuck — not programmed 5+ minutes after creation
          (gatewayapi_gateway_status{type="Programmed", namespace="envoy-gateway-system"} == 0)
            and on(name, namespace, cluster_id, installation, pipeline, provider) (
              (time() - gatewayapi_gateway_created{namespace="envoy-gateway-system"}) > 300
            )
          or
          # Option D: regression — was programmed recently, now isn't
          (gatewayapi_gateway_status{type="Programmed", namespace="envoy-gateway-system"} == 0)
            and on(name, namespace, cluster_id, installation, pipeline, provider) (
              max_over_time(gatewayapi_gateway_status{type="Programmed", namespace="envoy-gateway-system"}[10m]) == 1
            )
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyProxySDSInitFetchTimeout
      annotations:
        description: '{{`Envoy proxy {{ $labels.pod }} timed out fetching TLS secret {{ $labels.envoy_xds_resource_name }} over SDS and has not recovered. New TLS handshakes on its listeners fail while the pod still reports Ready, so it will not self-heal — the proxy pod must be restarted. Typically follows an Envoy Gateway control-plane restart (see envoyproxy/gateway#9519).`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: envoy_sds_init_fetch_timeout{namespace="envoy-gateway-system"} > 0
      # envoy_sds_init_fetch_timeout is a latching counter: once incremented it stays >0 until
      # the pod restarts, and the wedged state never self-heals. A long `for` therefore buys no
      # flap protection, it only delays the page — keep it short so we page before customer impact.
      for: 2m
      labels:
        area: platform
        cancel_if_outside_working_hours: "false"
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyProxyListenersStuckWarming
      annotations:
        description: '{{`Envoy proxy {{ $labels.pod }} has had listeners stuck in warming state for over 15m, so its latest configuration is not being served (it may still be serving the previous config). A persistently warming listener that never becomes active points at an xDS resource (e.g. an SDS secret) that never arrives.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: envoy_listener_manager_total_listeners_warming{namespace="envoy-gateway-system"} > 0
      for: 15m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: notify
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyProxyTLSHandshakesFailing
      annotations:
        description: '{{`Envoy proxy {{ $labels.pod }} is failing every TLS handshake on listener {{ $labels.envoy_listener_address }}: connections are erroring while not a single handshake succeeds, so the listener still accepts connections but serves nothing. The pod can stay Ready and the Gateway Programmed throughout, so this does not self-heal — the proxy pod most likely must be restarted. Cause-agnostic: an expired or mis-issued certificate, an SDS secret that never arrived, or an otherwise wedged proxy.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: |
        # Cause-agnostic "listener up, serving broken" detector: TLS connections error at a
        # meaningful rate while *zero* handshakes succeed on the same listener.
        rate(envoy_listener_ssl_connection_error{namespace="envoy-gateway-system"}[10m]) > 0.05
          and
        rate(envoy_listener_ssl_handshake{namespace="envoy-gateway-system"}[10m]) == 0
      # Both series carry an identical label set (they come from the same scrape target and are
      # both labelled per pod and envoy_listener_address), so the implicit full-label match of
      # `and` joins them exactly. Do NOT switch this to an explicit
      # `and on(pod, namespace, cluster_id, installation, pipeline, provider)` like the other
      # alerts here use: that would drop envoy_listener_address from the match and let an error
      # on one listener pair up with an idle sibling listener on the same pod.
      #
      # The 0.05/s floor (~3 errors/min) is what makes this safe on idle listeners, where a
      # single stray probe or aborted connection keeps `rate(...) > 0` true for a whole rate
      # window while `rate(handshake) == 0` is legitimately true. Measured over 7d on gazelle
      # and ferret, the error rate seen while handshakes were zero peaked at 0.0093/s, so this
      # keeps a ~5x margin; a listener that actually serves traffic runs at 0.1-1.1 handshakes/s
      # and would produce errors well above the floor if it started failing them all.
      # The unhardened `rate(error) > 0` form would have paged ~10 times in those 7 days,
      # including twice on production workload clusters.
      #
      # NOTE: do NOT use envoy_listener_ssl_no_certificate for this. Despite the name it counts
      # handshakes where the *client* presented no certificate, and on our proxies it equals the
      # total handshake count exactly — it would fire permanently.
      for: 5m
      labels:
        area: platform
        cancel_if_outside_working_hours: "false"
        severity: page
        team: cabbage
        topic: envoy-gateway
