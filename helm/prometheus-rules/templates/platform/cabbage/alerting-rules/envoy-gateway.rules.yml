apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: envoy-gateway.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: envoy-gateway
    rules:
    - alert: EnvoyGatewayDeploymentNotSatisfied
      annotations:
        description: '{{`Envoy Gateway Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has less than half of its replicas available.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/deployment-not-satisfied/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}&KIND=deployment&NAME={{ $labels.deployment }}`}}'
      expr: kube_deployment_status_replicas_available{namespace="envoy-gateway-system", deployment="envoy-gateway"} / (kube_deployment_status_replicas_available{namespace="envoy-gateway-system", deployment="envoy-gateway"} + kube_deployment_status_replicas_unavailable{namespace="envoy-gateway-system", deployment="envoy-gateway"}) * 100 <= 50
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: {{ include "workingHoursOnly" . }}
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyProxyDeploymentNotSatisfied
      annotations:
        description: '{{`Envoy Proxy Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has less than half of its replicas available.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/deployment-not-satisfied/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}&KIND=deployment&NAME={{ $labels.deployment }}`}}'
      expr: envoy_proxy_deployment_status_replicas_available / (envoy_proxy_deployment_status_replicas_available + envoy_proxy_deployment_status_replicas_unavailable) * 100 <= 50
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: {{ include "workingHoursOnly" . }}
        severity: page
        team: cabbage
        topic: envoy-gateway
    # - alert: EnvoyHighDownstreamHTTP5xxErrorRate
    #   annotations:
    #     description: '{{`More than 5% of downstream HTTP responses on {{ $labels.pod }} are 5xx ({{ $value | printf "%.1f" }}%).`}}'
    #     runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
    #   expr: |
    #     sum(
    #       rate(envoy_http_downstream_rq_xx{envoy_response_code_class="5"}[5m])
    #     ) by (pod, namespace, cluster_id, installation, pipeline, provider)
    #       /
    #     sum(
    #       rate(envoy_http_downstream_rq_completed[5m])
    #     ) by (pod, namespace, cluster_id, installation, pipeline, provider)
    #     * 100 > 5
    #     and sum(
    #       rate(envoy_http_downstream_rq_completed[5m])
    #     ) by (pod, namespace, cluster_id, installation, pipeline, provider) > 0
    #   for: 10m
    #   labels:
    #     area: platform
    #     cancel_if_outside_working_hours: "true"
    #     severity: page
    #     team: cabbage
    #     topic: envoy-gateway
    # - alert: EnvoyHighClusterUpstream5xxErrorRate
    #   annotations:
    #     description: '{{`More than 5% of upstream requests to Envoy cluster {{ $labels.envoy_cluster_name }} on {{ $labels.pod }} return 5xx ({{ $value | printf "%.1f" }}%).`}}'
    #     runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
    #   expr: | 
    #     rate(
    #       envoy_cluster_upstream_rq_xx{envoy_response_code_class="5"}[5m]
    #     ) 
    #       / 
    #     rate(
    #       envoy_cluster_upstream_rq_completed[5m]
    #     ) 
    #     * 100 > 5 
    #     and rate(
    #       envoy_cluster_upstream_rq_completed[5m]
    #     ) > 0
    #   for: 10m
    #   labels:
    #     area: platform
    #     cancel_if_outside_working_hours: "true"
    #     severity: page
    #     team: cabbage
    #     topic: envoy-gateway
    - alert: EnvoyHighDownstreamRequestTimeoutRate
      annotations:
        description: '{{`More than 10% of downstream requests to gateway {{ $labels.gateway_name }} are timing out ({{ $value | printf "%.1f" }}%).`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: |
        sum(
          envoy_http_downstream_rq_timeout
        ) by (gateway_name, namespace, cluster_id, installation, pipeline, provider)
          /
        sum(
          envoy_http_downstream_rq_completed
        ) by (gateway_name, namespace, cluster_id, installation, pipeline, provider)
        * 100 > 10
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyClusterCircuitBreakerTripped
      annotations:
        description: '{{`Circuit breaker is open for Envoy cluster {{ $labels.envoy_cluster_name }} on {{ $labels.pod }}.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: envoy_cluster_circuit_breakers_cx_open == 1 or envoy_cluster_circuit_breakers_rq_open == 1
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyControllerNotReconcilingGateway
      annotations:
        description: '{{`Envoy Gateway controller cannot reconcile Gateway {{ $labels.namespace }}/{{ $labels.name }}.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: | 
          # Option A: accepted but config never reached the proxy
          (gatewayapi_gateway_status{type="Accepted", namespace="envoy-gateway-system"} == 1)
            and on(name, namespace, cluster_id, installation, pipeline, provider)
          (gatewayapi_gateway_status{type="Programmed", namespace="envoy-gateway-system"} == 0)
          or
          # Option B: controller rejected the resource entirely
          (gatewayapi_gateway_status{type="Accepted", namespace="envoy-gateway-system"} == 0)
            and on(name, namespace, cluster_id, installation, pipeline, provider) (
              (time() - gatewayapi_gateway_created{namespace="envoy-gateway-system"}) > 120
            )
          or
          # Option C: stuck — not programmed 5+ minutes after creation
          (gatewayapi_gateway_status{type="Programmed", namespace="envoy-gateway-system"} == 0)
            and on(name, namespace, cluster_id, installation, pipeline, provider) (
              (time() - gatewayapi_gateway_created{namespace="envoy-gateway-system"}) > 300
            )
          or
          # Option D: regression — was programmed recently, now isn't
          (gatewayapi_gateway_status{type="Programmed", namespace="envoy-gateway-system"} == 0)
            and on(name, namespace, cluster_id, installation, pipeline, provider) (
              max_over_time(gatewayapi_gateway_status{type="Programmed", namespace="envoy-gateway-system"}[10m]) == 1
            )
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyProxySDSInitFetchTimeout
      annotations:
        description: '{{`Envoy proxy {{ $labels.pod }} timed out fetching TLS secret {{ $labels.envoy_xds_resource_name }} over SDS; new TLS handshakes fail until the pod is restarted.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      # The wedged proxy keeps reporting Ready, so it does not self-heal: the pod must be restarted.
      # This typically follows an Envoy Gateway control-plane restart (envoyproxy/gateway#9519).
      #
      # envoy_sds_init_fetch_timeout is a latching counter: once incremented it stays >0 until the
      # pod restarts. A bare `> 0` therefore keeps paging for a timeout that may have happened days
      # ago and had no lasting impact, so trigger on a *fresh* increment instead:
      #   increase(...[15m]) > 0        detects the timeout as it happens.
      #   max_over_time(...[2h:1m])     holds the alert for 2h after the last increment. The wedge
      #     does not self-heal while the counter stays static, so a bare increase() would resolve
      #     after 15m with the proxy still broken.
      #   and on(...) envoy_sds_init_fetch_timeout
      #     drops the hold once the pod no longer exists. A still-wedged proxy stays Ready and
      #     keeps exporting the counter, so this only removes series whose pod is gone — which is
      #     exactly what restarting the pod (the documented fix) or a rollout does. Without it the
      #     2h hold keeps paging for a proxy that was already replaced.
      # The oauth2/* exclusion keeps this alert on the TLS wedge it describes; OAuth2
      # client_secret/hmac_secret timeouts are a different failure, alerted separately.
      expr: |
        max_over_time(
          (
            increase(
              envoy_sds_init_fetch_timeout{namespace="envoy-gateway-system", envoy_xds_resource_name!~"oauth2/.*"}[15m]
            ) > 0
          )[2h:1m]
        )
        and on(installation, cluster_id, namespace, pod)
          envoy_sds_init_fetch_timeout{namespace="envoy-gateway-system"}
      for: 2m
      labels:
        area: platform
        cancel_if_outside_working_hours: "false"
        severity: page
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyProxyOAuth2SecretInitFetchTimeout
      annotations:
        description: '{{`Envoy proxy {{ $labels.pod }} timed out fetching OAuth2 secret {{ $labels.envoy_xds_resource_name }} over SDS; OIDC authentication fails until the pod is restarted.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      # Same latching-counter handling as EnvoyProxySDSInitFetchTimeout above, including the
      # on(...) guard that drops the 2h hold once the affected pod is gone.
      expr: |
        max_over_time(
          (
            increase(
              envoy_sds_init_fetch_timeout{namespace="envoy-gateway-system", envoy_xds_resource_name=~"oauth2/.*"}[15m]
            ) > 0
          )[2h:1m]
        )
        and on(installation, cluster_id, namespace, pod)
          envoy_sds_init_fetch_timeout{namespace="envoy-gateway-system"}
      for: 5m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: notify
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyProxyListenersStuckWarming
      annotations:
        description: '{{`Envoy proxy {{ $labels.pod }} has listeners stuck warming for over 15m and is not serving its latest configuration.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      expr: envoy_listener_manager_total_listeners_warming{namespace="envoy-gateway-system"} > 0
      for: 15m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: notify
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyGatewayConfigUpdateRateTooHigh
      annotations:
        description: '{{`Envoy Gateway configuration in cluster {{ $labels.cluster_id }} is changing too often ({{ $value | printf "%.1f" }} resource updates/min over the last hour).`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      # Envoy Gateway writes a status back only when a Gateway API resource actually changes, so
      # status_update_total tracks config churn: Gateways, HTTPRoutes and policies being added,
      # removed or edited. The fleet-wide per-cluster peak over 7 days is 0.4/min, so 1/min is a
      # generous threshold.
      #
      # This used to key off xds_snapshot_create_total, which is far too noisy to alert on: Envoy
      # Gateway rebuilds the whole xDS snapshot whenever a backend EndpointSlice changes, so ordinary
      # pod rollouts drove it to 6.6/min on a cluster where no Gateway API resource changed at all.
      # nginx updates its endpoints in-process without reloading, which is why its reload counter
      # works as a config-churn signal and the snapshot counter does not.
      #
      # The namespace matcher is required: the metric name is generic and must only match the Envoy
      # Gateway control plane. sum-then-max adds up the resource kinds while keeping the control-plane
      # replicas from double counting.
      expr: max by (cluster_id, installation, pipeline, provider, namespace) (sum by (cluster_id, installation, pipeline, provider, namespace, pod) (rate(status_update_total{namespace="envoy-gateway-system", status="success"}[60m]))) * 60 > 1
      for: 15m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: notify
        team: cabbage
        topic: envoy-gateway
    - alert: EnvoyProxyConfigUpdateRejected
      annotations:
        description: '{{`Envoy proxy {{ $labels.pod }} rejected a configuration update in the last 15m and keeps serving its previous configuration.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/envoy-gateway/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}`}}'
      # Same latching-counter handling as EnvoyProxySDSInitFetchTimeout: the *_update_rejected counters
      # never decrease until the pod restarts, so a bare `> 0` would keep paging for a rejection that
      # happened days ago. increase(...[15m]) > 0 catches the rejection as it happens and
      # max_over_time(...[2h:1m]) holds the alert for 2h, since a rejected config does not heal on its
      # own while the counter stays static. Do not simplify this back to `> 0`.
      # `or` rather than a sum: a proxy that exports only some of the four counters (e.g. no SDS
      # resources) would make a sum-based expression evaluate to nothing.
      expr: |
        max_over_time(
          (
            increase(envoy_listener_manager_lds_update_rejected{namespace="envoy-gateway-system"}[15m]) > 0
            or increase(envoy_cluster_manager_cds_update_rejected{namespace="envoy-gateway-system"}[15m]) > 0
            or increase(envoy_http_rds_update_rejected{namespace="envoy-gateway-system"}[15m]) > 0
            or increase(envoy_sds_update_rejected{namespace="envoy-gateway-system"}[15m]) > 0
          )[2h:1m]
        )
      for: 5m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: cabbage
        topic: envoy-gateway
