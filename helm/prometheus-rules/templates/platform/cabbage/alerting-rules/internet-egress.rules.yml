apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: internet-egress.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: internet-egress
    rules:
#
# ClusterInternetEgressUnavailable
#
# net-exporter cannot detect loss of internet egress: its DNS check is sent to the CoreDNS ClusterIP, so it
# measures CoreDNS's egress rather than each node's, and if the CoreDNS pods sit in a healthy zone every node
# reports success. Its network check dials in-cluster pod IPs, and its NTP check is configured to the
# cloud provider's link-local time service. None of them leave the VPC.
#
# prometheus-blackbox-exporter does have the signal: it runs as a DaemonSet probing external HTTPS endpoints
# from every node, so it has per-node - and therefore per-availability-zone - coverage.
#
# The rule covers every external domain the exporter probes, and fires per target. An allowlist-style firewall
# change can block a single domain while the others stay reachable - during the incident behind this alert,
# www.giantswarm.io stayed green for three hours while the cluster could not pull images - so one representative
# endpoint proves egress is broken when it fails, but never proves egress is healthy (giantswarm/giantswarm#33409).
# Targets absent on a cluster (older prometheus-blackbox-exporter releases only probe http-giantswarm) simply
# produce no series and cannot fire.
#
# The selector matches the `egress-` name prefix rather than an explicit domain list, so per-installation
# overrides of prometheus-blackbox-exporter's `serviceMonitor.externalTargets` (regional or customer-specific
# domains) are covered without touching this rule. It deliberately does NOT match `http-.*`: the exporter also
# serves internal probes carrying that shape (`http-api`, and `http-irsawebhook` from irsa-servicemonitors),
# which must never page as internet egress. `http-giantswarm` predates the prefix convention and keeps its name
# so fleets on older exporter releases stay covered.
#
# `http-giantswarm` only counts on clusters that have no `egress-` target. Where the `egress-` targets exist they
# cover the domains a cluster actually needs, and www.giantswarm.io is not one of them: proxies and customer
# firewalls with a domain allowlist legitimately block it (garm's proxy answered it with 403 on 2026-10-20, and
# on vSphere a customer firewall most likely drops it), and the alert paged permanently while egress was fine
# (giantswarm/giantswarm#38412).
# The `unless` is matched per cluster, so a cluster only falls back to `http-giantswarm` while its exporter
# release does not ship the `egress-` targets. An installation that overrides `externalTargets` takes over that
# coverage: its `egress-` targets have to include real internet endpoints, or a loss of internet egress
# goes unnoticed.
#
# The threshold is a fraction of a cluster's probes, not `> 0`. Measured over 30 days on two installations, the
# normal background is isolated single-node probe failures reaching at most 17% of a cluster, while a single
# availability zone of two or three is 33-50%, so `>= 0.2` separates them cleanly.
#
# There is deliberately no kube_pod_info/kube_node_labels join here to resolve the availability zone. The zone
# is useful context, but joining for it makes this rule inherit kube-state-metrics' availability, and
# kube_pod_info emits duplicate series for a pod while it is churning - which makes the join fail with
# `found duplicate series` rather than return a value. A rule that errors cannot fire, and node churn is
# exactly what a loss of egress causes. The runbook carries the zone-attribution query instead.
#
# `cancel_if_kube_state_metrics_down` is absent for the same reason: this rule does not read kube-state-metrics,
# so kube-state-metrics being down must not suppress it.
#
# On a management cluster the description names the CAPI controllers. If they run in a zone that lost egress,
# the MC loses its connection to workload clusters and cannot rotate their bootstrap tokens, so they cannot add
# nodes. The oncaller should see that before opening the runbook. `cluster_type` is kept in both `count by` clauses
# so the description can branch on it, which also makes it an alert label.
#
    - alert: ClusterInternetEgressUnavailable
      annotations:
        description: |-
          {{`{{ $value | humanizePercentage }} of nodes on {{ $labels.installation }}/{{ $labels.cluster_id }} cannot reach {{ $labels.target }}.{{ if eq $labels.cluster_type "management_cluster" }} On a management cluster, if one zone is affected, first check whether the CAPI controllers run in it.{{ end }}`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/internet-egress-unavailable/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: |
        (
          count by (cluster_id, cluster_type, installation, pipeline, provider, target) (
            (
              probe_success{job=~".*prometheus-blackbox-exporter.*", target=~"egress-.+"}
              or
              (
                probe_success{job=~".*prometheus-blackbox-exporter.*", target="http-giantswarm"}
                unless on (cluster_id, installation)
                probe_success{job=~".*prometheus-blackbox-exporter.*", target=~"egress-.+"}
              )
            ) == 0
          )
          /
          count by (cluster_id, cluster_type, installation, pipeline, provider, target) (
            (
              probe_success{job=~".*prometheus-blackbox-exporter.*", target=~"egress-.+"}
              or
              (
                probe_success{job=~".*prometheus-blackbox-exporter.*", target="http-giantswarm"}
                unless on (cluster_id, installation)
                probe_success{job=~".*prometheus-blackbox-exporter.*", target=~"egress-.+"}
              )
            )
          )
        ) >= 0.2
      for: 15m
      labels:
        area: platform
        # Pages 24/7 on purpose: a cluster that cannot reach the internet cannot pull images, reconcile Flux,
        # or receive the mitigation an oncaller is applying.
        cancel_if_outside_working_hours: "false"
        cancel_if_cluster_has_no_workers: "true"
        cancel_if_metrics_broken: "true"
        cancel_if_monitoring_agent_down: "true"
        severity: page
        team: cabbage
        topic: network
