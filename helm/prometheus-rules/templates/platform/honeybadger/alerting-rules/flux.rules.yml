apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    {{- include "labels.common" . | nindent 4 }}
  name: fluxcd.rules
  namespace: {{ .Values.namespace  }}
spec:
  groups:
  - name: fluxcd
    rules:
    - alert: FluxCriticalDeploymentNotSatisfied
      annotations:
        description: '{{`Flux deployment {{ $labels.namespace}}/{{ $labels.deployment }} is not satisfied.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/deployment-not-satisfied/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}&KIND=deployment&NAME={{ $labels.deployment }}`}}'
      expr: kube_deployment_status_replicas_unavailable{cluster_type="management_cluster", namespace="flux-giantswarm", deployment!="flux-giantswarm-flux-ksm"} > 0
      for: 30m
      labels:
        area: platform
        cancel_if_outside_working_hours: {{ include "workingHoursOnly" . }}
        severity: page
        team: honeybadger
        topic: managementcluster
    - alert: FluxNonCriticalDeploymentNotSatisfied
      annotations:
        description: '{{`Flux deployment {{ $labels.namespace}}/{{ $labels.deployment }} is not satisfied.`}}'
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/deployment-not-satisfied/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.namespace }}&KIND=deployment&NAME={{ $labels.deployment }}`}}'
      expr: kube_deployment_status_replicas_unavailable{cluster_type="management_cluster", namespace="flux-giantswarm", deployment="flux-giantswarm-flux-ksm"} > 0
      for: 30m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: honeybadger
        topic: managementcluster
#
# FluxGiantswarmHelmReleaseFailed
#
# Alerting for GiantSwarm management clusters HelmRelease CRs in flux-giantswarm and giantswarm namespaces.
#
    - alert: FluxGiantswarmHelmReleaseFailed
      annotations:
        description: |-
          {{`Flux HelmRelease {{ $labels.name }} in ns {{ $labels.exported_namespace }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is stuck in Failed state.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-helmrelease-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.exported_namespace }}&HELMRELEASE_NAME={{ $labels.name }}`}}'
      expr: |
        label_replace(
          gotk_resource_info{job="flux-ksm", ready="False", customresource_kind="HelmRelease", cluster_type="management_cluster", exported_namespace=~"flux-giantswarm|giantswarm"},
          "team", "honeybadger", "team", "^$"
        ) > 0
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        topic: releng
        namespace: |-
          {{`{{ $labels.exported_namespace }}`}}
#
# FluxCustomerHelmReleaseFailed
#
# Alerting for GiantSwarm management clusters HelmRelease CRs in remaining namespaces.
#
    - alert: FluxCustomerHelmReleaseFailed
      annotations:
        description: |-
          {{`Flux HelmRelease {{ $labels.name }} in ns {{ $labels.exported_namespace }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is stuck in Failed state.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-helmrelease-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.exported_namespace }}&HELMRELEASE_NAME={{ $labels.name }}`}}'
      expr: |
        gotk_resource_info{job="flux-ksm", ready="False", customresource_kind="HelmRelease", cluster_type="management_cluster", exported_namespace!~"flux-giantswarm|giantswarm|org-t-.*", team!~"^$|noteam"} > 0
        unless on(name, exported_namespace)
        ALERTS{alertname="FluxHelmReleaseFailed"}
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        topic: releng
        namespace: |-
          {{`{{ $labels.exported_namespace }}`}}
#
# FluxWorkloadClusterHelmReleaseFailed
#
# Alerting for GiantSwarm-owned workload clusters. The `organization` label makes sure of that.
#
    - alert: FluxGiantswarmWorkloadClusterHelmReleaseFailed
      annotations:
        description: |-
          {{`Flux HelmRelease {{ $labels.name }} in ns {{ $labels.exported_namespace }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is stuck in Failed state.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-helmrelease-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.exported_namespace }}&HELMRELEASE_NAME={{ $labels.name }}`}}'
      expr: gotk_resource_info{ready="False", job="kube-state-metrics", customresource_kind="HelmRelease", cluster_type="workload_cluster", organization="giantswarm"} > 0
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: honeybadger
        topic: releng
        namespace: |-
          {{`{{ $labels.exported_namespace }}`}}
#
# FluxKustomizationFailed
#
# Alerting for GiantSwarm management clusters Kustomization CRs.
#
    - alert: FluxKustomizationFailed
      annotations:
        description: |-
          {{`Flux Kustomization {{ $labels.name }} in ns {{ $labels.exported_namespace }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is stuck in Failed state.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-kustomization-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.exported_namespace }}&KUSTOMIZATION_NAME={{ $labels.name }}`}}'
      expr: gotk_resource_info{job="flux-ksm", ready="False", customresource_kind="Kustomization", cluster_type="management_cluster", exported_namespace=~".*giantswarm.*", name!="silences"} > 0
      for: 20m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: honeybadger
        topic: releng
#
# FluxWorkloadClusterKustomizationFailed
#
# Alerting for GiantSwarm-owned workload clusters. The `organization` label makes sure of that.
#
    - alert: FluxWorkloadClusterKustomizationFailed
      annotations:
        description: |-
          {{`Flux Kustomization {{ $labels.name }} in ns {{ $labels.exported_namespace }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is stuck in Failed state.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-kustomization-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.exported_namespace }}&KUSTOMIZATION_NAME={{ $labels.name }}`}}'
      expr: gotk_resource_info{ready="False", job="kube-state-metrics", customresource_kind="Kustomization", cluster_type="workload_cluster", organization="giantswarm"} > 0
      for: 2h
      labels:
        area: platform
        severity: page
        cancel_if_outside_working_hours: "true"
        team: honeybadger
        topic: releng
#
# FluxSourceFailed
#
# Alerting for GiantSwarm management clusters Flux source-related CRs.
#
    - alert: FluxSourceFailed
      annotations:
        description: |-
          {{`{{ $value }} Flux {{ $labels.customresource_kind }} source(s) in ns {{ $labels.exported_namespace }} on {{ $labels.installation }}/{{ $labels.cluster_id }} are stuck in Failed state.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-source-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.exported_namespace }}`}}'
      # Covers every namespace: on a customer MC most sources live in `default` and `org-*` (giantswarm#37456).
      # Aggregated per namespace/kind because a loss of egress fails hundreds of sources at once.
      expr: |
        count by (cluster_id, customresource_kind, exported_namespace, installation, pipeline, provider) (
          gotk_resource_info{job="flux-ksm", ready="False", customresource_kind=~"GitRepository|HelmRepository|Bucket|OCIRepository", cluster_type="management_cluster"}
        ) > 0
      for: 30m
      labels:
        area: platform
        # Pages 24/7 on purpose: if Flux cannot fetch its sources, nothing can be delivered to the cluster,
        # including the mitigation an oncaller is trying to apply. See giantswarm#37391.
        cancel_if_outside_working_hours: "false"
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_metrics_broken: "true"
        cancel_if_monitoring_agent_down: "true"
        severity: page
        team: honeybadger
        topic: releng
#
# FluxWorkloadClusterSourceFailed
#
# Alerting for GiantSwarm-owned workload clusters. The `organization` label makes sure of that.
#
    - alert: FluxWorkloadClusterSourceFailed
      annotations:
        description: |-
          {{`Flux {{ $labels.customresource_kind }} {{ $labels.name }} in ns {{ $labels.exported_namespace }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is stuck in Failed state.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-source-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}&NAMESPACE={{ $labels.exported_namespace }}&SOURCE_NAME={{ $labels.name }}`}}'
      expr: gotk_resource_info{ready="False", job="kube-state-metrics", customresource_kind=~"GitRepository|HelmRepository|Bucket|OCIRepository", cluster_type="workload_cluster", organization="giantswarm"} > 0
      for: 30m
      labels:
        area: platform
        # Pages 24/7, same reasoning as FluxSourceFailed. See giantswarm#37391.
        cancel_if_outside_working_hours: "false"
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_metrics_broken: "true"
        cancel_if_monitoring_agent_down: "true"
        severity: page
        team: honeybadger
        topic: releng
    # this alert checks average reconciliation times in 10 min windows, then calculates monthly error budget usage for it
    - alert: FluxReconciliationLongErrorBudgetLow
      annotations:
        description: |-
          {{`Flux object {{ $labels.kind }}/{{ $labels.name }} on {{ $labels.installation }}/{{ $labels.cluster_id }} is below the error threshold of its error budget.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-slow-reconciliation/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: |
        1-sum_over_time(
        (
          (
          sum(increase(gotk_reconcile_duration_seconds_sum{namespace="flux-giantswarm", cluster_type="management_cluster", exported_namespace="flux-giantswarm",kind=~"Kustomization|HelmRelease"}[10m])) by (kind, name, cluster_id, installation, pipeline, provider)
          /
          sum(increase(gotk_reconcile_duration_seconds_count{namespace="flux-giantswarm", cluster_type="management_cluster", exported_namespace="flux-giantswarm",kind=~"Kustomization|HelmRelease"}[10m])) by (kind, name, cluster_id, installation, pipeline, provider)
          )
        >bool 360)[7d:10m])
        / (7*24*6) < 0.97
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: honeybadger
        topic: releng
    - alert: FluxSuspendedForTooLong
      annotations:
        description: |-
          {{`Flux {{ $labels.customresource_kind }} {{ $labels.name }} in ns {{ $labels.exported_namespace }} on {{ $labels.installation }} has been suspended for 24h.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-suspended/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: gotk_resource_info{job="flux-ksm", cluster_type="management_cluster", exported_namespace="flux-giantswarm", suspended="true"} > 0
      for: 24h
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: honeybadger
        topic: releng
#
# FluxCustomerSuspendedForTooLong
#
# Suspended objects outside `flux-giantswarm` are legitimately paused by customers, so this never pages -
# it only makes "paused for weeks" discoverable. One silently blocked reconciliation during giantswarm#37391.
#
    - alert: FluxCustomerSuspendedForTooLong
      annotations:
        description: |-
          {{`{{ $value }} Flux {{ $labels.customresource_kind }}(s) in ns {{ $labels.exported_namespace }} on {{ $labels.installation }} have been suspended for 7 days.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-suspended/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: |
        count by (cluster_id, customresource_kind, exported_namespace, installation, pipeline, provider) (
          gotk_resource_info{job="flux-ksm", cluster_type="management_cluster", exported_namespace!="flux-giantswarm", suspended="true"}
        ) > 0
      for: 7d
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_metrics_broken: "true"
        cancel_if_monitoring_agent_down: "true"
        severity: notify
        team: honeybadger
        topic: releng
#
# FluxMetricsMissing
#
# Dead-man's switch for Flux alerting itself: every other alert here is built on `gotk_resource_info`, so
# when flux-ksm stops reporting they all silently stop being able to fire (giantswarm#37391, for four hours).
# Uses the Mimir-safe `absent()` pattern (see README, "Absent function").
#
    - alert: FluxMetricsMissing
      annotations:
        description: |-
          {{`Flux metrics are missing on {{ $labels.installation }}: no gotk_resource_info from flux-ksm, so no Flux alert can fire.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-metrics-missing/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: absent(gotk_resource_info{job="flux-ksm", cluster_type="management_cluster", cluster_id="{{ .Values.managementCluster.name }}", installation="{{ .Values.managementCluster.name }}", provider="{{ .Values.managementCluster.provider.kind }}", pipeline="{{ .Values.managementCluster.pipeline }}"})
      for: 30m
      labels:
        area: platform
        # Pages 24/7: while this fires, Flux alerting is blind.
        cancel_if_outside_working_hours: "false"
        cancel_if_kube_state_metrics_down: "true"
        cancel_if_metrics_broken: "true"
        cancel_if_monitoring_agent_down: "true"
        severity: page
        team: honeybadger
        topic: releng
    - alert: FluxWorkqueueTooLong
      annotations:
        description: |-
          {{`Flux artifacts are stuck in work queue for over 1 hour and are not being reconciled.`}}
        runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-workqueue/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
      expr: |
        sum by (cluster_id, installation, name, namespace, pipeline, provider) (workqueue_unfinished_work_seconds{namespace="flux-giantswarm", cluster_type="management_cluster"}) > 3600.0
      for: 10m
      labels:
        area: platform
        cancel_if_outside_working_hours: "true"
        severity: page
        team: honeybadger
        topic: releng
