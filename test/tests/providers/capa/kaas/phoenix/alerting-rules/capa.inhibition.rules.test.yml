---
rule_files:
- capa.inhibition.rules.yml

tests:
  # Tests for `InhibitionClusterWithoutWorkerNodes` inhibition alert
  - interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{cluster_id="testinst", cluster_type="management_cluster", name="testinst", pipeline="testing", status="True", type="ControlPlaneReady"}'
        values: "1+0x300"
      - series: 'capi_machinepool_spec_replicas{cluster_id="testinst", cluster_name="testinst", cluster_type="management_cluster", customer="giantswarm", installation="testinst", organization="giantswarm", pipeline="testing", provider="capa"}'
        values: "_x60 0x60 3x60"
      - series: 'capi_cluster_info{infrastructure_reference_kind="AWSCluster", cluster_id="testinst"}'
        values: "1+0x300"
    alert_rule_test:
      - alertname: InhibitionClusterWithoutWorkerNodes
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              area: kaas
              cluster_id: "testinst"
              cluster_type: "management_cluster"
              has_worker_nodes: "false"
              name: "testinst"
              pipeline: "testing"
              status: "True"
              team: "phoenix"
              topic: "status"
              type: "ControlPlaneReady"
            exp_annotations:
              description: "Cluster (testinst) has no worker nodes."
      - alertname: InhibitionClusterWithoutWorkerNodes
        eval_time: 90m
        exp_alerts:
          - exp_labels:
              area: kaas
              cluster_id: "testinst"
              cluster_type: "management_cluster"
              has_worker_nodes: "false"
              name: "testinst"
              pipeline: "testing"
              status: "True"
              team: "phoenix"
              topic: "status"
              type: "ControlPlaneReady"
            exp_annotations:
              description: "Cluster (testinst) has no worker nodes."
      - alertname: InhibitionClusterWithoutWorkerNodes
        eval_time: 150m
