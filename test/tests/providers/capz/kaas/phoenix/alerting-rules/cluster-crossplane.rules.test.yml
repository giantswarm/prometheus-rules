rule_files:
  - cluster-crossplane.rules.yml

tests:
  - interval: 1m
    input_series:
      - series: 'crossplane_managed_resource_exists{gvk="network.azure.upbound.io/v1beta1, Kind=PrivateLinkService", cluster_id="mymc", installation="test-installation"}'
        values: "2x20"
      - series: 'crossplane_managed_resource_ready{gvk="network.azure.upbound.io/v1beta1, Kind=PrivateLinkService", cluster_id="mymc", installation="test-installation"}'
        values: "1x20"

    alert_rule_test:
      - alertname: ClusterCrossplaneResourcesNotReady
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "false"
              cluster_id: "mymc"
              gvk: "network.azure.upbound.io/v1beta1, Kind=PrivateLinkService"
              installation: "test-installation"
              severity: page
              team: phoenix
            exp_annotations:
              description: 'Not all managed Crossplane resources of type "network.azure.upbound.io/v1beta1, Kind=PrivateLinkService" on mymc are ready. This could affect creation or health of workload clusters.'
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cluster-crossplane-resources/?INSTALLATION=test-installation&CLUSTER=mymc

  - interval: 1m
    input_series:
      - series: 'crossplane_managed_resource_exists{gvk="storage.azure.upbound.io/v1beta1, Kind=Account", cluster_id="mymc", installation="test-installation"}'
        values: "5x70"
      - series: 'crossplane_managed_resource_synced{gvk="storage.azure.upbound.io/v1beta1, Kind=Account", cluster_id="mymc", installation="test-installation"}'
        values: "0x70"

    alert_rule_test:
      - alertname: ClusterCrossplaneResourcesNotSynced
        eval_time: 30m
        exp_alerts: []
      - alertname: ClusterCrossplaneResourcesNotSynced
        eval_time: 70m
        exp_alerts:
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "false"
              cluster_id: "mymc"
              gvk: "storage.azure.upbound.io/v1beta1, Kind=Account"
              installation: "test-installation"
              severity: page
              team: phoenix
            exp_annotations:
              description: 'Not all managed Crossplane resources of type "storage.azure.upbound.io/v1beta1, Kind=Account" on mymc are synced. This could affect creation or health of workload clusters.'
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/cluster-crossplane-resources/?INSTALLATION=test-installation&CLUSTER=mymc
