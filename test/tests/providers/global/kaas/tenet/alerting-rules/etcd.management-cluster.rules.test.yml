rule_files:
  - etcd.management-cluster.rules.yml

tests:
  - interval: 1m
    input_series:
      # alpha: quorum lost - 2 of 3 members report no leader - should fire after 2m
      - series: 'etcd_server_has_leader{app="etcd", cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="alpha", pod="etcd-alpha-0"}'
        values: "0+0x10"
      - series: 'etcd_server_has_leader{app="etcd", cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="alpha", pod="etcd-alpha-1"}'
        values: "0+0x10"
      - series: 'etcd_server_has_leader{app="etcd", cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="alpha", pod="etcd-alpha-2"}'
        values: "1+0x10"
      # beta: single member without a leader (1 of 3) - not quorum loss - should NOT fire
      - series: 'etcd_server_has_leader{app="etcd", cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="beta", pod="etcd-beta-0"}'
        values: "0+0x10"
      - series: 'etcd_server_has_leader{app="etcd", cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="beta", pod="etcd-beta-1"}'
        values: "1+0x10"
      - series: 'etcd_server_has_leader{app="etcd", cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="beta", pod="etcd-beta-2"}'
        values: "1+0x10"
      # gamma: transient leader election - 2 of 3 lose the leader for 1m only (< 2m for) - should NOT fire
      - series: 'etcd_server_has_leader{app="etcd", cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="gamma", pod="etcd-gamma-0"}'
        values: "0 1+0x10"
      - series: 'etcd_server_has_leader{app="etcd", cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="gamma", pod="etcd-gamma-1"}'
        values: "0 1+0x10"
      - series: 'etcd_server_has_leader{app="etcd", cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="gamma", pod="etcd-gamma-2"}'
        values: "1+0x10"
    alert_rule_test:
      # before 2m the true quorum loss is still pending - nothing fires
      - alertname: ManagementClusterEtcdQuorumLost
        eval_time: 1m
        exp_alerts: []
      # after 2m only alpha (real quorum loss) fires; beta and gamma stay quiet
      - alertname: ManagementClusterEtcdQuorumLost
        eval_time: 5m
        exp_alerts:
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "false"
              severity: notify
              team: tenet
              topic: etcd
              cluster_id: alpha
              installation: myinst
              provider: capa
              pipeline: stable
            exp_annotations:
              description: "Etcd on cluster myinst/alpha has lost quorum: a majority of members report no leader."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-troubleshooting/

  # WAL fsync latency: a slow-disk instance (p99 ~8s) fires, a healthy one (p99 ~8ms) stays quiet
  - interval: 1m
    input_series:
      # slow: all fsync observations land in the (4s, 8s] bucket -> p99 ~8s, well above the 0.5s threshold
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="slow", pod="etcd-slow-0", le="0.5"}'
        values: "0+0x40"
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="slow", pod="etcd-slow-0", le="4"}'
        values: "0+0x40"
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="slow", pod="etcd-slow-0", le="8"}'
        values: "0+100x40"
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="slow", pod="etcd-slow-0", le="+Inf"}'
        values: "0+100x40"
      # healthy: all fsync observations land in the (<=8ms] bucket -> p99 ~8ms, no alert
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="fast", pod="etcd-fast-0", le="0.008"}'
        values: "0+100x40"
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="fast", pod="etcd-fast-0", le="8"}'
        values: "0+100x40"
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="fast", pod="etcd-fast-0", le="+Inf"}'
        values: "0+100x40"
    alert_rule_test:
      - alertname: ManagementClusterEtcdWALFsyncDurationTooHigh
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "false"
              severity: notify
              team: tenet
              topic: etcd
              cluster_id: slow
              cluster_type: management_cluster
              installation: myinst
              provider: capa
              pipeline: stable
              pod: etcd-slow-0
            exp_annotations:
              description: "Etcd (etcd-slow-0) in cluster myinst/slow has a too high WAL fsync duration, indicating slow disk I/O that can cascade into leader elections and quorum loss."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-troubleshooting/

  # backend commit latency: a slow-disk instance (p99 ~8s) fires the tightened 0.25s threshold, a healthy one stays quiet
  - interval: 1m
    input_series:
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="slow", pod="etcd-slow-0", le="0.25"}'
        values: "0+0x40"
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="slow", pod="etcd-slow-0", le="4"}'
        values: "0+0x40"
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="slow", pod="etcd-slow-0", le="8"}'
        values: "0+100x40"
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="slow", pod="etcd-slow-0", le="+Inf"}'
        values: "0+100x40"
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="fast", pod="etcd-fast-0", le="0.008"}'
        values: "0+100x40"
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="fast", pod="etcd-fast-0", le="8"}'
        values: "0+100x40"
      - series: 'etcd_disk_backend_commit_duration_seconds_bucket{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="fast", pod="etcd-fast-0", le="+Inf"}'
        values: "0+100x40"
    alert_rule_test:
      - alertname: ManagementClusterEtcdCommitDurationTooHigh
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "false"
              severity: notify
              team: tenet
              topic: etcd
              cluster_id: slow
              cluster_type: management_cluster
              installation: myinst
              provider: capa
              pipeline: stable
              pod: etcd-slow-0
            exp_annotations:
              description: "Etcd (etcd-slow-0) in cluster myinst/slow has a too high commit duration."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-troubleshooting/

  # database quota: a member at ~98% of its quota pages immediately, one at ~82% only trips the 80% warning
  - interval: 1m
    input_series:
      - series: 'etcd_mvcc_db_total_size_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="full", pod="etcd-full-0"}'
        values: "8400000000+0x120"
      - series: 'etcd_server_quota_backend_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="full", pod="etcd-full-0"}'
        values: "8589934592+0x120"
      - series: 'etcd_mvcc_db_total_size_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="large", pod="etcd-large-0"}'
        values: "7000000000+0x120"
      - series: 'etcd_server_quota_backend_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="large", pod="etcd-large-0"}'
        values: "8589934592+0x120"
    alert_rule_test:
      - alertname: ManagementClusterEtcdDBSizeAlmostAtQuota
        eval_time: 4m
        exp_alerts: []
      - alertname: ManagementClusterEtcdDBSizeAlmostAtQuota
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "false"
              severity: page
              team: tenet
              topic: etcd
              cluster_id: full
              cluster_type: management_cluster
              installation: myinst
              provider: capa
              pipeline: stable
              pod: etcd-full-0
            exp_annotations:
              description: "Etcd (etcd-full-0) in cluster myinst/full is about to reach its database quota and stop accepting writes."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-database-quota/
      # both are past 80%, so the pre-existing warning covers them once its 90m window elapses
      - alertname: ManagementClusterEtcdDBSizeTooLarge
        eval_time: 100m
        exp_alerts:
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "false"
              severity: page
              team: tenet
              topic: etcd
              cluster_id: full
              cluster_type: management_cluster
              installation: myinst
              provider: capa
              pipeline: stable
              pod: etcd-full-0
            exp_annotations:
              description: "Etcd (etcd-full-0) in cluster myinst/full has a too large database."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-database-quota/
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "false"
              severity: page
              team: tenet
              topic: etcd
              cluster_id: large
              cluster_type: management_cluster
              installation: myinst
              provider: capa
              pipeline: stable
              pod: etcd-large-0
            exp_annotations:
              description: "Etcd (etcd-large-0) in cluster myinst/large has a too large database."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-database-quota/

  # growth trend: only a database that is both past half its quota and on a trajectory crossing it within 24h alerts
  - interval: 1m
    input_series:
      # growing: starts at 50% of the quota and gains 2.5MB/min -> crosses the quota well inside 24h
      - series: 'etcd_mvcc_db_total_size_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="growing", pod="etcd-growing-0"}'
        values: "4300000000+2500000x480"
      - series: 'etcd_server_quota_backend_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="growing", pod="etcd-growing-0"}'
        values: "8589934592+0x480"
      # flat: parked at 60% of the quota with no growth -> extrapolation stays below the quota
      - series: 'etcd_mvcc_db_total_size_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="flat", pod="etcd-flat-0"}'
        values: "5150000000+0x480"
      - series: 'etcd_server_quota_backend_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="flat", pod="etcd-flat-0"}'
        values: "8589934592+0x480"
      # small: growing twice as fast, but still under half the quota -> held back by the guard
      - series: 'etcd_mvcc_db_total_size_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="small", pod="etcd-small-0"}'
        values: "1000000000+5000000x480"
      - series: 'etcd_server_quota_backend_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="small", pod="etcd-small-0"}'
        values: "8589934592+0x480"
    alert_rule_test:
      - alertname: ManagementClusterEtcdDBSizeGrowingTowardsQuota
        eval_time: 60m
        exp_alerts: []
      - alertname: ManagementClusterEtcdDBSizeGrowingTowardsQuota
        eval_time: 420m
        exp_alerts:
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "true"
              severity: notify
              team: tenet
              topic: etcd
              cluster_id: growing
              cluster_type: management_cluster
              installation: myinst
              provider: capa
              pipeline: stable
              pod: etcd-growing-0
            exp_annotations:
              description: "Etcd (etcd-growing-0) in cluster myinst/growing is on track to reach its database quota within 24 hours."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-database-quota/

  # free pages: mirrors the etcd-defrag job's rule - fires only past 80% of quota with >10% of the quota reclaimable
  - interval: 1m
    input_series:
      # fragmented: 88% of the quota allocated, 58% in use -> 30% of the quota is reclaimable, the job should have acted
      - series: 'etcd_mvcc_db_total_size_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="fragmented", pod="etcd-fragmented-0"}'
        values: "7600000000+0x150"
      - series: 'etcd_mvcc_db_total_size_in_use_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="fragmented", pod="etcd-fragmented-0"}'
        values: "5000000000+0x150"
      - series: 'etcd_server_quota_backend_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="fragmented", pod="etcd-fragmented-0"}'
        values: "8589934592+0x150"
      # compact: equally large, but almost all of it in use -> a defrag reclaims nothing, this is real data
      - series: 'etcd_mvcc_db_total_size_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="compact", pod="etcd-compact-0"}'
        values: "7600000000+0x150"
      - series: 'etcd_mvcc_db_total_size_in_use_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="compact", pod="etcd-compact-0"}'
        values: "7500000000+0x150"
      - series: 'etcd_server_quota_backend_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="compact", pod="etcd-compact-0"}'
        values: "8589934592+0x150"
      # roomy: heavily fragmented but only 35% of the quota allocated -> the job deliberately skips this, and so do we
      - series: 'etcd_mvcc_db_total_size_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="roomy", pod="etcd-roomy-0"}'
        values: "3000000000+0x150"
      - series: 'etcd_mvcc_db_total_size_in_use_in_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="roomy", pod="etcd-roomy-0"}'
        values: "200000000+0x150"
      - series: 'etcd_server_quota_backend_bytes{cluster_type="management_cluster", provider="capa", pipeline="stable", installation="myinst", cluster_id="roomy", pod="etcd-roomy-0"}'
        values: "8589934592+0x150"
    alert_rule_test:
      - alertname: ManagementClusterEtcdDBNeedsDefragmentation
        eval_time: 60m
        exp_alerts: []
      - alertname: ManagementClusterEtcdDBNeedsDefragmentation
        eval_time: 130m
        exp_alerts:
          - exp_labels:
              area: kaas
              cancel_if_outside_working_hours: "true"
              severity: notify
              team: tenet
              topic: etcd
              cluster_id: fragmented
              cluster_type: management_cluster
              installation: myinst
              provider: capa
              pipeline: stable
              pod: etcd-fragmented-0
            exp_annotations:
              description: "Etcd (etcd-fragmented-0) in cluster myinst/fragmented has reclaimable free pages that the hourly etcd-defrag job should have reclaimed and did not."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/etcd-database-quota/
