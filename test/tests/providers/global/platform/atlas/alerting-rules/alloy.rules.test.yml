              cluster_id: golem
              installation: golem
              provider: capa
              pipeline: testing
              severity: none
              statefulset: alloy-metrics
              team: atlas
              topic: observability
              inhibit_monitoring_agent_down: "true"
            exp_annotations:
              description: "At least one of the monitoring agent shard is missing."
              summary: "Monitoring agent is missing shards."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/alloy/#monitoring-agent-down?INSTALLATION=golem&CLUSTER=golem
