---
rule_files:
- kube-state-metrics.rules.yml

tests:
  # KubeStateMetricsDown anchors on the cluster's control plane being ready and fires when no
  # kube-state-metrics target reports `up == 1` for that cluster.
  - name: "KubeStateMetricsDown"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="golem", type="ControlPlaneReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x240"
      # - 00:00 no target at all
      # - 00:30 target up
      # - 01:00 target down
      # - 01:30 target up again
      - series: 'up{job="kube-state-metrics", endpoint="http", cluster_id="golem", installation="golem", provider="capa", pipeline="testing"}'
        values: "_x30 1x30 0x30 1x30"
    alert_rule_test:
      - alertname: KubeStateMetricsDown
        eval_time: 25m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_cluster_control_plane_unhealthy: "true"
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_kubelet_down: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              inhibit_kube_state_metrics_down: "true"
              severity: "page"
              team: "atlas"
              topic: "observability"
              cluster_id: "golem"
              installation: "golem"
              name: "golem"
              pipeline: "testing"
              provider: "capa"
              status: "True"
              type: "ControlPlaneReady"
            exp_annotations:
              description: "KubeStateMetrics is down."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=golem"
      # target is up, nothing fires
      - alertname: KubeStateMetricsDown
        eval_time: 55m
      # target reports up == 0
      - alertname: KubeStateMetricsDown
        eval_time: 85m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_cluster_control_plane_unhealthy: "true"
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_kubelet_down: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              inhibit_kube_state_metrics_down: "true"
              severity: "page"
              team: "atlas"
              topic: "observability"
              cluster_id: "golem"
              installation: "golem"
              name: "golem"
              pipeline: "testing"
              provider: "capa"
              status: "True"
              type: "ControlPlaneReady"
            exp_annotations:
              description: "KubeStateMetrics is down."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=golem"
      - alertname: KubeStateMetricsDown
        eval_time: 115m

  # KubeStateMetricsNotRetrievingMetrics catches the case where the target is up but serves
  # implausibly little data.
  - name: "KubeStateMetricsNotRetrievingMetrics"
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", endpoint="http", cluster_id="golem", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster_id="golem", installation="golem", provider="capa", pipeline="testing", pod="a"}'
        values: "1x60"
    alert_rule_test:
      - alertname: KubeStateMetricsNotRetrievingMetrics
        eval_time: 10m
      - alertname: KubeStateMetricsNotRetrievingMetrics
        eval_time: 25m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_cluster_control_plane_unhealthy: "true"
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_kube_state_metrics_down: "true"
              cancel_if_kubelet_down: "true"
              cancel_if_outside_working_hours: "true"
              inhibit_kube_state_metrics_down: "true"
              severity: "page"
              team: "atlas"
              topic: "observability"
              cluster_id: "golem"
              installation: "golem"
              pipeline: "testing"
              provider: "capa"
            exp_annotations:
              description: "KubeStateMetrics is not retrieving metrics."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=golem"

  # The inhibition source must arm well before the alerts it inhibits, and must clear as soon as
  # kube-state-metrics serves pod metrics again.
  - name: "InhibitionKubeStateMetricsDown"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="golem", type="ControlPlaneReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster_id="golem", installation="golem", provider="capa", pipeline="testing", pod="a"}'
        values: "_x20 1x40"
    alert_rule_test:
      # not yet armed one minute in
      - alertname: InhibitionKubeStateMetricsDown
        eval_time: 1m
      - alertname: InhibitionKubeStateMetricsDown
        eval_time: 5m
        exp_alerts:
          - exp_labels:
              area: "platform"
              inhibit_kube_state_metrics_down: "true"
              severity: "none"
              team: "atlas"
              topic: "observability"
              cluster_id: "golem"
              installation: "golem"
              pipeline: "testing"
              provider: "capa"
            exp_annotations:
              description: "KubeStateMetrics is not serving data for cluster golem."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=golem"
      # pod metrics are back
      - alertname: InhibitionKubeStateMetricsDown
        eval_time: 25m

  # One alert for the whole expected metric set: it clears only when all ten are present, and fires
  # the same way whether one resource kind or the whole lot goes missing.
  - name: "KubeStateMetricsMetricsMissing"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="golem", type="ControlPlaneReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x120"
      # all ten present for the first hour, then kube_endpoint_created alone disappears
      - series: 'kube_endpoint_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x60 _x60"
      - series: 'kube_configmap_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x120"
      - series: 'kube_daemonset_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x120"
      - series: 'kube_deployment_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x120"
      - series: 'kube_namespace_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x120"
      - series: 'kube_node_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x120"
      - series: 'kube_pod_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x120"
      - series: 'kube_replicaset_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x120"
      - series: 'kube_secret_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x120"
      - series: 'kube_service_created{job="kube-state-metrics", cluster_id="golem"}'
        values: "1x120"
    alert_rule_test:
      # all ten present
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 55m
      # one missing is enough, once `for` has elapsed
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 80m
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 100m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_kube_state_metrics_down: "true"
              cancel_if_outside_working_hours: "true"
              severity: "page"
              team: "atlas"
              topic: "kubernetes"
              cluster_id: "golem"
              installation: "golem"
              pipeline: "testing"
              provider: "capa"
            exp_annotations:
              description: "At least one kube-state-metrics resource metric is missing for cluster golem."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=golem"

  # Total loss of kube-state-metrics data fires the same single alert, not one per metric.
  - name: "KubeStateMetricsMetricsMissing with no metrics at all"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="golem", type="ControlPlaneReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
    alert_rule_test:
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 45m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_kube_state_metrics_down: "true"
              cancel_if_outside_working_hours: "true"
              severity: "page"
              team: "atlas"
              topic: "kubernetes"
              cluster_id: "golem"
              installation: "golem"
              pipeline: "testing"
              provider: "capa"
            exp_annotations:
              description: "At least one kube-state-metrics resource metric is missing for cluster golem."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=golem"
