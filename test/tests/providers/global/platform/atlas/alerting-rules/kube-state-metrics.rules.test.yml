---
rule_files:
- kube-state-metrics.rules.yml

tests:
  # KubeStateMetricsDown anchors on the cluster's control plane being ready and fires when no
  # kube-state-metrics target reports `up == 1` for that cluster.
  - name: "KubeStateMetricsDown"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="golem", type="ControlPlaneReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x240"
      # - 00:00 no target at all
      # - 00:30 target up
      # - 01:00 target down
      # - 01:30 target up again
      - series: 'up{job="kube-state-metrics", endpoint="http", cluster_id="golem", installation="golem", provider="capa", pipeline="testing"}'
        values: "_x30 1x30 0x30 1x30"
    alert_rule_test:
      - alertname: KubeStateMetricsDown
        eval_time: 25m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_cluster_control_plane_unhealthy: "true"
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_kubelet_down: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              inhibit_kube_state_metrics_down: "true"
              severity: "page"
              team: "atlas"
              topic: "observability"
              cluster_id: "golem"
              installation: "golem"
              name: "golem"
              pipeline: "testing"
              provider: "capa"
              status: "True"
              type: "ControlPlaneReady"
            exp_annotations:
              description: "KubeStateMetrics is down."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=golem"
      # target is up, nothing fires
      - alertname: KubeStateMetricsDown
        eval_time: 55m
      # target reports up == 0
      - alertname: KubeStateMetricsDown
        eval_time: 85m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_cluster_control_plane_unhealthy: "true"
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_kubelet_down: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              inhibit_kube_state_metrics_down: "true"
              severity: "page"
              team: "atlas"
              topic: "observability"
              cluster_id: "golem"
              installation: "golem"
              name: "golem"
              pipeline: "testing"
              provider: "capa"
              status: "True"
              type: "ControlPlaneReady"
            exp_annotations:
              description: "KubeStateMetrics is down."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=golem"
      - alertname: KubeStateMetricsDown
        eval_time: 115m

  # KubeStateMetricsNotRetrievingMetrics catches the case where the target is up but serves
  # implausibly little data.
  - name: "KubeStateMetricsNotRetrievingMetrics"
    interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", endpoint="http", cluster_id="golem", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
      - series: 'kube_pod_status_phase{job="kube-state-metrics", cluster_id="golem", installation="golem", provider="capa", pipeline="testing", pod="a"}'
        values: "1x60"
    alert_rule_test:
      - alertname: KubeStateMetricsNotRetrievingMetrics
        eval_time: 10m
      - alertname: KubeStateMetricsNotRetrievingMetrics
        eval_time: 25m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_cluster_control_plane_unhealthy: "true"
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_kube_state_metrics_down: "true"
              cancel_if_kubelet_down: "true"
              cancel_if_outside_working_hours: "true"
              inhibit_kube_state_metrics_down: "true"
              severity: "page"
              team: "atlas"
              topic: "observability"
              cluster_id: "golem"
              installation: "golem"
              pipeline: "testing"
              provider: "capa"
            exp_annotations:
              description: "KubeStateMetrics is not retrieving metrics."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=golem"

  # Both clusters sit on the same installation, so a join re-keyed on anything coarser than
  # cluster_id (installation, provider, pipeline) would let the healthy cluster cancel the broken
  # one and this scenario would fail.
  - name: "KubeStateMetricsDown is scoped per cluster"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="broken-wc", type="ControlPlaneReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
      - series: 'capi_cluster_status_condition{name="healthy-wc", type="ControlPlaneReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
      # only the healthy cluster has a kube-state-metrics target
      - series: 'up{job="kube-state-metrics", endpoint="http", cluster_id="healthy-wc", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
    alert_rule_test:
      - alertname: KubeStateMetricsDown
        eval_time: 25m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_cluster_control_plane_unhealthy: "true"
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_kubelet_down: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              inhibit_kube_state_metrics_down: "true"
              severity: "page"
              team: "atlas"
              topic: "observability"
              cluster_id: "broken-wc"
              installation: "golem"
              name: "broken-wc"
              pipeline: "testing"
              provider: "capa"
              status: "True"
              type: "ControlPlaneReady"
            exp_annotations:
              description: "KubeStateMetrics is down."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=broken-wc"

  # With no ready control plane to anchor on, the rule must stay silent even though no
  # kube-state-metrics target exists. This is the guard against the dead `count(...) == 0` clause
  # being "fixed" into something that pages for every cluster at once.
  - name: "KubeStateMetricsDown stays silent without a ready control plane"
    interval: 1m
    input_series:
      # control plane is explicitly not ready
      - series: 'capi_cluster_status_condition{name="unready-wc", type="ControlPlaneReady", status="False", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
      # a different condition that is True must not be mistaken for the anchor
      - series: 'capi_cluster_status_condition{name="unready-wc", type="InfrastructureReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
    alert_rule_test:
      - alertname: KubeStateMetricsDown
        eval_time: 25m
      - alertname: KubeStateMetricsDown
        eval_time: 45m

  # The anchor appearing is what starts the clock; before it exists there is nothing to page about.
  - name: "KubeStateMetricsDown waits for the anchor to appear"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="late-wc", type="ControlPlaneReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "_x30 1x40"
    alert_rule_test:
      # no anchor yet, nothing to fire on
      - alertname: KubeStateMetricsDown
        eval_time: 25m
      # anchor present since 30m, `for: 15m` elapsed
      - alertname: KubeStateMetricsDown
        eval_time: 50m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_cluster_control_plane_unhealthy: "true"
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_kubelet_down: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              inhibit_kube_state_metrics_down: "true"
              severity: "page"
              team: "atlas"
              topic: "observability"
              cluster_id: "late-wc"
              installation: "golem"
              name: "late-wc"
              pipeline: "testing"
              provider: "capa"
              status: "True"
              type: "ControlPlaneReady"
            exp_annotations:
              description: "KubeStateMetrics is down."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=late-wc"

  # kube-state-metrics exposes two ports and the ServiceMonitor scrapes both; only the `http`
  # endpoint serves the resource metrics. A healthy telemetry endpoint must not mask a dead one.
  - name: "KubeStateMetricsDown only considers the http endpoint"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="two-port-wc", type="ControlPlaneReady", status="True", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
      # the telemetry port is up, the metrics port has no target at all
      - series: 'up{job="kube-state-metrics", endpoint="metrics", cluster_id="two-port-wc", installation="golem", provider="capa", pipeline="testing"}'
        values: "1x60"
    alert_rule_test:
      - alertname: KubeStateMetricsDown
        eval_time: 25m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_cluster_control_plane_unhealthy: "true"
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_kubelet_down: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              inhibit_kube_state_metrics_down: "true"
              severity: "page"
              team: "atlas"
              topic: "observability"
              cluster_id: "two-port-wc"
              installation: "golem"
              name: "two-port-wc"
              pipeline: "testing"
              provider: "capa"
              status: "True"
              type: "ControlPlaneReady"
            exp_annotations:
              description: "KubeStateMetrics is down."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=golem&CLUSTER=two-port-wc"

  # Two clusters on one installation. A join keyed on anything coarser than cluster_id would let the
  # healthy cluster cancel the broken one. `name` differs from `installation` so this also pins that
  # cluster_id is derived from the cluster name.
  - name: "KubeStateMetricsMetricsMissing is scoped per cluster"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="wc-alpha", type="ControlPlaneReady", status="True", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'capi_cluster_status_condition{name="wc-beta", type="ControlPlaneReady", status="True", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      # wc-alpha loses kube_endpoint_created after an hour
      - series: 'kube_configmap_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_daemonset_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_deployment_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_endpoint_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x60 _x60"
      - series: 'kube_namespace_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_node_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_pod_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_replicaset_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_secret_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_service_created{job="kube-state-metrics", cluster_id="wc-alpha", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      # wc-beta stays healthy throughout
      - series: 'kube_configmap_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_daemonset_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_deployment_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_endpoint_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_namespace_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_node_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_pod_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_replicaset_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_secret_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
      - series: 'kube_service_created{job="kube-state-metrics", cluster_id="wc-beta", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x120"
    alert_rule_test:
      # all ten present
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 55m
      # one missing since 60m, `for: 30m` has not elapsed yet
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 80m
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 100m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_kube_state_metrics_down: "true"
              cancel_if_outside_working_hours: "true"
              severity: "page"
              team: "atlas"
              topic: "kubernetes"
              cluster_id: "wc-alpha"
              installation: "myinstall"
              pipeline: "testing"
              provider: "capa"
            exp_annotations:
              description: "At least one kube-state-metrics resource metric is missing for cluster wc-alpha."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=myinstall&CLUSTER=wc-alpha"

  # A kube_*_created series from another exporter must not count towards the expected set.
  - name: "KubeStateMetricsMetricsMissing only counts kube-state-metrics series"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="wc-gamma", type="ControlPlaneReady", status="True", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      - series: 'kube_configmap_created{job="kube-state-metrics", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      - series: 'kube_daemonset_created{job="kube-state-metrics", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      - series: 'kube_deployment_created{job="kube-state-metrics", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      - series: 'kube_endpoint_created{job="kube-state-metrics", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      - series: 'kube_namespace_created{job="kube-state-metrics", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      - series: 'kube_node_created{job="kube-state-metrics", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      - series: 'kube_pod_created{job="kube-state-metrics", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      - series: 'kube_replicaset_created{job="kube-state-metrics", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      - series: 'kube_secret_created{job="kube-state-metrics", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
      # same metric name, different job
      - series: 'kube_service_created{job="some-other-exporter", cluster_id="wc-gamma", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x80"
    alert_rule_test:
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 45m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_kube_state_metrics_down: "true"
              cancel_if_outside_working_hours: "true"
              severity: "page"
              team: "atlas"
              topic: "kubernetes"
              cluster_id: "wc-gamma"
              installation: "myinstall"
              pipeline: "testing"
              provider: "capa"
            exp_annotations:
              description: "At least one kube-state-metrics resource metric is missing for cluster wc-gamma."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=myinstall&CLUSTER=wc-gamma"

  # No ready control plane means nothing to page about, even with no metrics at all.
  - name: "KubeStateMetricsMetricsMissing needs a ready control plane"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="wc-delta", type="ControlPlaneReady", status="False", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x60"
      - series: 'capi_cluster_status_condition{name="wc-delta", type="InfrastructureReady", status="True", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x60"
    alert_rule_test:
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 45m

  # Total loss of kube-state-metrics data fires the same single alert, not one per metric.
  - name: "KubeStateMetricsMetricsMissing with no metrics at all"
    interval: 1m
    input_series:
      - series: 'capi_cluster_status_condition{name="wc-epsilon", type="ControlPlaneReady", status="True", installation="myinstall", provider="capa", pipeline="testing"}'
        values: "1x60"
    alert_rule_test:
      - alertname: KubeStateMetricsMetricsMissing
        eval_time: 45m
        exp_alerts:
          - exp_labels:
              area: "platform"
              cancel_if_kube_state_metrics_down: "true"
              cancel_if_outside_working_hours: "true"
              severity: "page"
              team: "atlas"
              topic: "kubernetes"
              cluster_id: "wc-epsilon"
              installation: "myinstall"
              pipeline: "testing"
              provider: "capa"
            exp_annotations:
              description: "At least one kube-state-metrics resource metric is missing for cluster wc-epsilon."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/kube-state-metrics-down/?INSTALLATION=myinstall&CLUSTER=wc-epsilon"
