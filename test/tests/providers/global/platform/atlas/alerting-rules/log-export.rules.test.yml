---
rule_files:
  - log-export.rules.yml

tests:
  # LogExportNotUploading: alloy-logexporter pods go away after 60m, so the sent series disappears.
  - interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{statefulset="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable"}'
        values: "2x180"
      - series: 'otelcol_exporter_sent_log_records_total{job="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable", component_id="otelcol.exporter.awss3.audit"}'
        values: "0+60x60"
    alert_rule_test:
      - alertname: LogExportNotUploading
        eval_time: 60m
      # The 30m rate window empties out around 90m, then the 30m `for` starts.
      - alertname: LogExportNotUploading
        eval_time: 110m
      - alertname: LogExportNotUploading
        eval_time: 130m
        exp_alerts:
          - exp_labels:
              area: platform
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              cluster_id: myinstall
              installation: myinstall
              pipeline: stable
              provider: $provider
              severity: page
              team: atlas
              topic: observability
            exp_annotations:
              summary: Log export is enabled but nothing is being uploaded.
              description: "alloy-logexporter has uploaded no log records for 30 minutes, so the archive is silently missing data."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/log-export/?INSTALLATION=myinstall&CLUSTER=myinstall

  # LogExportNotUploading: pods stay up, uploads stop after 60m.
  - interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{statefulset="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable"}'
        values: "2x180"
      - series: 'otelcol_exporter_sent_log_records_total{job="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable", component_id="otelcol.exporter.awss3.audit"}'
        values: "0+60x60 3600x120"
    alert_rule_test:
      - alertname: LogExportNotUploading
        eval_time: 110m
      - alertname: LogExportNotUploading
        eval_time: 130m
        exp_alerts:
          - exp_labels:
              area: platform
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              cluster_id: myinstall
              installation: myinstall
              pipeline: stable
              provider: $provider
              severity: page
              team: atlas
              topic: observability
            exp_annotations:
              summary: Log export is enabled but nothing is being uploaded.
              description: "alloy-logexporter has uploaded no log records for 30 minutes, so the archive is silently missing data."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/log-export/?INSTALLATION=myinstall&CLUSTER=myinstall

  # Uploads flowing: nothing fires.
  - interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{statefulset="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable"}'
        values: "2x180"
      - series: 'otelcol_exporter_sent_log_records_total{job="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable", component_id="otelcol.exporter.awss3.audit"}'
        values: "0+60x180"
    alert_rule_test:
      - alertname: LogExportNotUploading
        eval_time: 130m
      - alertname: LogExportRecordsLost
        eval_time: 130m

  # The feature is not in use here: no StatefulSet, so nothing may fire.
  - interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{statefulset="loki-write", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable"}'
        values: "3x480"
    alert_rule_test:
      - alertname: LogExportNotUploading
        eval_time: 130m
      - alertname: LogExportRecordsLost
        eval_time: 130m
      - alertname: LogExportNothingSelected
        eval_time: 7h

  # LogExportRecordsLost: uploads given up on.
  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records_total{job="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable", component_id="otelcol.exporter.awss3.audit"}'
        values: "0x60 0+60x60"
    alert_rule_test:
      - alertname: LogExportRecordsLost
        eval_time: 45m
      - alertname: LogExportRecordsLost
        eval_time: 90m
        exp_alerts:
          - exp_labels:
              area: platform
              cancel_if_outside_working_hours: "true"
              cluster_id: myinstall
              installation: myinstall
              pipeline: stable
              provider: $provider
              severity: notify
              team: atlas
              topic: observability
            exp_annotations:
              summary: alloy-logexporter is losing log records.
              description: "alloy-logexporter is losing 1.00 log records per second to failed uploads or a full sending queue. They are permanently missing from the archive."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/log-export/?INSTALLATION=myinstall&CLUSTER=myinstall

  # LogExportRecordsLost: the full queue refuses records.
  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_enqueue_failed_log_records_total{job="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable", component_id="otelcol.exporter.awss3.audit"}'
        values: "0x60 0+30x60"
    alert_rule_test:
      - alertname: LogExportRecordsLost
        eval_time: 45m
      - alertname: LogExportRecordsLost
        eval_time: 90m
        exp_alerts:
          - exp_labels:
              area: platform
              cancel_if_outside_working_hours: "true"
              cluster_id: myinstall
              installation: myinstall
              pipeline: stable
              provider: $provider
              severity: notify
              team: atlas
              topic: observability
            exp_annotations:
              summary: alloy-logexporter is losing log records.
              description: "alloy-logexporter is losing 0.50 log records per second to failed uploads or a full sending queue. They are permanently missing from the archive."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/log-export/?INSTALLATION=myinstall&CLUSTER=myinstall

  # LogExportNothingSelected: two exports, one uploads, the other never does.
  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_capacity{job="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable", component_id="otelcol.exporter.awss3.audit", data_type="logs"}'
        values: "200000x480"
      - series: 'otelcol_exporter_queue_capacity{job="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable", component_id="otelcol.exporter.awss3.teleport", data_type="logs"}'
        values: "200000x480"
      - series: 'otelcol_exporter_queue_capacity{job="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable", component_id="otelcol.exporter.awss3.teleport", data_type="traces"}'
        values: "200000x480"
      - series: 'otelcol_exporter_sent_log_records_total{job="alloy-logexporter", cluster_id="myinstall", installation="myinstall", provider="$provider", pipeline="stable", component_id="otelcol.exporter.awss3.audit"}'
        values: "0+60x480"
    alert_rule_test:
      # The 6h `for` has not elapsed yet.
      - alertname: LogExportNothingSelected
        eval_time: 5h
      - alertname: LogExportNothingSelected
        eval_time: 7h
        exp_alerts:
          - exp_labels:
              area: platform
              cancel_if_outside_working_hours: "true"
              cluster_id: myinstall
              component_id: otelcol.exporter.awss3.teleport
              installation: myinstall
              pipeline: stable
              provider: $provider
              severity: notify
              team: atlas
              topic: observability
            exp_annotations:
              summary: A LogExport has uploaded nothing for 6 hours.
              description: "otelcol.exporter.awss3.teleport on alloy-logexporter has uploaded no records for 6 hours, so its selector likely matches no stream."
              runbook_url: https://intranet.giantswarm.io/docs/support-and-ops/runbooks/log-export/?INSTALLATION=myinstall&CLUSTER=myinstall
