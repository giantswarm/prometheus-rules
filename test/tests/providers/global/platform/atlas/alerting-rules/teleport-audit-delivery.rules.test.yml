---
rule_files:
  - teleport-audit-delivery.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # Two live clusters on one installation; wc1's probe stream dies at t=60m.
      - series: 'capi_cluster_status_condition{app="kube-state-metrics", type="ControlPlaneReady", status="True", name="wc1", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "1x180"
      - series: 'capi_cluster_status_phase{app="kube-state-metrics", phase="Deleting", name="wc1", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "0x180"
      - series: 'capi_cluster_status_condition{app="kube-state-metrics", type="ControlPlaneReady", status="True", name="wc2", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "1x180"
      - series: 'capi_cluster_status_phase{app="kube-state-metrics", phase="Deleting", name="wc2", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "0x180"
      - series: 'giantswarm:teleport_audit:probe_events:count_45m{cluster_id="wc1", installation="myinstall", pipeline="stable"}'
        values: "3x60"
      - series: 'giantswarm:teleport_audit:probe_events:count_45m{cluster_id="wc2", installation="myinstall", pipeline="stable"}'
        values: "3x180"
    alert_rule_test:
      # While both streams are healthy: nothing fires.
      - alertname: TeleportAuditProbeMissing
        eval_time: 50m
        exp_alerts: []
      # wc1 stream stale since ~65m (last sample + ~5m staleness); the alert
      # goes pending at that point but must not fire yet at 100m, since
      # for: 40m means it needs to stay pending until ~105m. This pins the
      # for: window — with a too-short for: (e.g. 2m) this check would fail.
      - alertname: TeleportAuditProbeMissing
        eval_time: 100m
        exp_alerts: []
      # By 110m (~45m after going pending, safely past the ~105m firing
      # point), wc1 has been continuously stale for longer than for: 40m.
      # wc2 stays quiet throughout.
      - alertname: TeleportAuditProbeMissing
        eval_time: 110m
        exp_alerts:
          - exp_labels:
              area: platform
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_outside_working_hours: "true"
              cluster_id: wc1
              installation: myinstall
              pipeline: stable
              provider: $provider
              severity: page
              team: atlas
              topic: observability
            exp_annotations:
              description: 'No Teleport audit events from cluster wc1 (installation myinstall) reached its Loki for 45m — audit log delivery for this cluster is broken.'
              runbook_url: 'https://intranet.giantswarm.io/docs/support-and-ops/runbooks/teleport-audit-log-delivery/?INSTALLATION=myinstall&CLUSTER=wc1'
