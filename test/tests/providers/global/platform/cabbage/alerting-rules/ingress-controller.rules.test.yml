---
rule_files:
  - ingress-controller.rules.yml

tests:
  # IngressControllerDown must NOT page when a single replica out of many is unscrapable.
  # This is the agama-pcn01 case from 2026-08-04: one pod's /metrics endpoint kept hitting the
  # 10s scrape timeout for 20-40m at a time while the pod stayed Ready and served traffic, and
  # the other 30 replicas were fine. The old per-pod `up == 0` rule paged twice that night.
  - interval: 1m
    input_series:
      # the flapping target: long contiguous stretches of up == 0, well past the 15m for-window
      - series: 'up{pod="ingress-nginx-app-controller-abc-spk6p", node="ip-10-206-138-102.cn-north-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "0x180"
      # three healthy peers of the same controller
      - series: 'up{pod="ingress-nginx-app-controller-abc-6zqk5", node="ip-10-206-142-7.cn-north-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "1x180"
      - series: 'up{pod="ingress-nginx-app-controller-abc-bcp42", node="ip-10-206-142-190.cn-north-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "1x180"
      - series: 'up{pod="ingress-nginx-app-controller-abc-nc2lm", node="ip-10-206-138-26.cn-north-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "1x180"
    alert_rule_test:
      # 1 of 4 down = 25%, never crosses the 50% quorum: no alert at any point
      - alertname: IngressControllerDown
        eval_time: 20m
      - alertname: IngressControllerDown
        eval_time: 60m
      - alertname: IngressControllerDown
        eval_time: 180m

  # A rollout that leaves a minority of new replicas unscrapable must not page either.
  # This is the alligator-p-fr-omni case from 2026-07-23: 3 new pods stuck in ImagePullBackOff
  # while the old ReplicaSet kept serving traffic from 5 healthy pods.
  - interval: 1m
    input_series:
      - series: 'up{pod="ingress-nginx-app-controller-new-1", node="ip-10-0-0-1.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="alligator", cluster_id="p-fr-omni"}'
        values: "0x180"
      - series: 'up{pod="ingress-nginx-app-controller-new-2", node="ip-10-0-0-2.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="alligator", cluster_id="p-fr-omni"}'
        values: "0x180"
      - series: 'up{pod="ingress-nginx-app-controller-new-3", node="ip-10-0-0-3.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="alligator", cluster_id="p-fr-omni"}'
        values: "0x180"
      - series: 'up{pod="ingress-nginx-app-controller-old-1", node="ip-10-0-0-4.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="alligator", cluster_id="p-fr-omni"}'
        values: "1x180"
      - series: 'up{pod="ingress-nginx-app-controller-old-2", node="ip-10-0-0-5.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="alligator", cluster_id="p-fr-omni"}'
        values: "1x180"
      - series: 'up{pod="ingress-nginx-app-controller-old-3", node="ip-10-0-0-6.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="alligator", cluster_id="p-fr-omni"}'
        values: "1x180"
      - series: 'up{pod="ingress-nginx-app-controller-old-4", node="ip-10-0-0-7.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="alligator", cluster_id="p-fr-omni"}'
        values: "1x180"
      - series: 'up{pod="ingress-nginx-app-controller-old-5", node="ip-10-0-0-8.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="alligator", cluster_id="p-fr-omni"}'
        values: "1x180"
    alert_rule_test:
      # 3 of 8 down = 37.5%: no page
      - alertname: IngressControllerDown
        eval_time: 30m
      - alertname: IngressControllerDown
        eval_time: 180m

  # A real outage must still page: a majority of the controller's replicas go down and stay down.
  - interval: 1m
    input_series:
      - series: 'up{pod="ingress-nginx-app-controller-abc-aaa", node="ip-10-0-0-1.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "1x20 0x180"
      - series: 'up{pod="ingress-nginx-app-controller-abc-bbb", node="ip-10-0-0-2.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "1x20 0x180"
      - series: 'up{pod="ingress-nginx-app-controller-abc-ccc", node="ip-10-0-0-3.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "1x200"
    alert_rule_test:
      # healthy before the outage
      - alertname: IngressControllerDown
        eval_time: 15m
      # 2 of 3 down = 66% from 21m, but still inside the 15m for-window
      - alertname: IngressControllerDown
        eval_time: 30m
      # sustained past the for-window: pages, one instance per down pod, ip label populated
      - alertname: IngressControllerDown
        eval_time: 40m
        exp_alerts:
          - exp_labels:
              area: platform
              severity: page
              team: cabbage
              topic: ingress
              cancel_if_outside_working_hours: "false"
              cancel_if_kubelet_down: "true"
              pod: ingress-nginx-app-controller-abc-aaa
              node: ip-10-0-0-1.eu-west-1.compute.internal
              ip: 10.0.0.1
              namespace: ingress-controllers
              job: ingress-nginx-app-controller-metrics
              installation: agama
              cluster_id: pcn01
            exp_annotations:
              description: "More than half of the Ingress Controller replicas of ingress-nginx-app-controller-metrics in namespace ingress-controllers are down (ingress-nginx-app-controller-abc-aaa is one of them)."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/managed-app-nginx-ic/"
          - exp_labels:
              area: platform
              severity: page
              team: cabbage
              topic: ingress
              cancel_if_outside_working_hours: "false"
              cancel_if_kubelet_down: "true"
              pod: ingress-nginx-app-controller-abc-bbb
              node: ip-10-0-0-2.eu-west-1.compute.internal
              ip: 10.0.0.2
              namespace: ingress-controllers
              job: ingress-nginx-app-controller-metrics
              installation: agama
              cluster_id: pcn01
            exp_annotations:
              description: "More than half of the Ingress Controller replicas of ingress-nginx-app-controller-metrics in namespace ingress-controllers are down (ingress-nginx-app-controller-abc-bbb is one of them)."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/managed-app-nginx-ic/"

  # A single-replica ingress controller must still page when its only replica is down, and the
  # small internal controller must be evaluated separately from the large public one sharing the
  # same namespace. Here the public controller is fully healthy while the internal one is down.
  - interval: 1m
    input_series:
      - series: 'up{pod="internal-ingress-nginx-app-controller-x", node="ip-10-0-0-9.eu-west-1.compute.internal", namespace="ingress-controllers", job="internal-ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "0x180"
      - series: 'up{pod="ingress-nginx-app-controller-abc-aaa", node="ip-10-0-0-1.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "1x180"
      - series: 'up{pod="ingress-nginx-app-controller-abc-bbb", node="ip-10-0-0-2.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "1x180"
      - series: 'up{pod="ingress-nginx-app-controller-abc-ccc", node="ip-10-0-0-3.eu-west-1.compute.internal", namespace="ingress-controllers", job="ingress-nginx-app-controller-metrics", installation="agama", cluster_id="pcn01"}'
        values: "1x180"
    alert_rule_test:
      - alertname: IngressControllerDown
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              area: platform
              severity: page
              team: cabbage
              topic: ingress
              cancel_if_outside_working_hours: "false"
              cancel_if_kubelet_down: "true"
              pod: internal-ingress-nginx-app-controller-x
              node: ip-10-0-0-9.eu-west-1.compute.internal
              ip: 10.0.0.9
              namespace: ingress-controllers
              job: internal-ingress-nginx-app-controller-metrics
              installation: agama
              cluster_id: pcn01
            exp_annotations:
              description: "More than half of the Ingress Controller replicas of internal-ingress-nginx-app-controller-metrics in namespace ingress-controllers are down (internal-ingress-nginx-app-controller-x is one of them)."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/managed-app-nginx-ic/"
