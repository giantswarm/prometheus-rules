      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts: []
      - alertname: ClusterInternetEgressTargetUnreachable
        eval_time: 30m
        exp_alerts: []

  # One availability zone loses egress on a cluster with the egress- targets: the nodes behind the dead path
  # fail every target. 3 of 8 nodes = 37.5% pages once for the cluster, not once per target, and the target
