---
rule_files:
  - internet-egress.rules.yml

tests:
  # One availability zone loses egress: a stable fraction of the cluster failing, sustained, while the rest
  # stays healthy. 3 of 8 probes = 37.5%, which is what one zone of three looks like.
  # http-irsawebhook is an internal probe (irsa-servicemonitors) served by the same exporter; it fails on every
  # node here and must never appear in the alerts - only the egress-*/http-giantswarm targets may fire.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-3"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-4"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-5"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-6"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-7"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-irsawebhook", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-irsawebhook", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "0x60"
    alert_rule_test:
      # not yet firing before `for: 15m` has elapsed
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 10m
        exp_alerts: []
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts:
          - exp_annotations:
              description: "37.5% of nodes on myinstall/myinstall cannot reach http-giantswarm. On a management cluster, if one zone is affected, first check whether the CAPI controllers run in it."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/internet-egress-unavailable/?INSTALLATION=myinstall&CLUSTER=myinstall"
            exp_labels:
              alertname: "ClusterInternetEgressUnavailable"
              area: platform
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_metrics_broken: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "false"
              cluster_id: "myinstall"
              cluster_type: "management_cluster"
              installation: "myinstall"
              pipeline: "stable"
              provider: "$provider"
              severity: "page"
              target: "http-giantswarm"
              team: "cabbage"
              topic: "network"

  # Whole cluster loses egress - must page just the same.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-3"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-4"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-5"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-6"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-7"}'
        values: "0x60"
    alert_rule_test:
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts:
          - exp_annotations:
              description: "100% of nodes on myinstall/myinstall cannot reach http-giantswarm. On a management cluster, if one zone is affected, first check whether the CAPI controllers run in it."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/internet-egress-unavailable/?INSTALLATION=myinstall&CLUSTER=myinstall"
            exp_labels:
              alertname: "ClusterInternetEgressUnavailable"
              area: platform
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_metrics_broken: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "false"
              cluster_id: "myinstall"
              cluster_type: "management_cluster"
              installation: "myinstall"
              pipeline: "stable"
              provider: "$provider"
              severity: "page"
              target: "http-giantswarm"
              team: "cabbage"
              topic: "network"

  # Noise case. Measured over 30 days on two installations, the normal background is isolated single-node
  # probe failures peaking at 17% of a cluster. 1 of 8 = 12.5% must stay quiet.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-3"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-4"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-5"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-6"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-7"}'
        values: "1x60"
    alert_rule_test:
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts: []

  # A brief blip must not page. A firewall change landing can fail every probe in a cluster for a single
  # scrape and then recover.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "1x5 0x5 1x50"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "1x5 0x5 1x50"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "1x5 0x5 1x50"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-3"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-4"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-5"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-6"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-7"}'
        values: "1x60"
    alert_rule_test:
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts: []

  # One domain blocked on every node while another stays reachable - the allowlist-change shape from the
  # incident. Exactly one alert must fire, naming the blocked target, and the healthy target must stay quiet.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-github", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-github", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-github", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-github", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-3"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-3"}'
        values: "1x60"
    alert_rule_test:
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts:
          - exp_annotations:
              description: "100% of nodes on myinstall/myinstall cannot reach egress-github. On a management cluster, if one zone is affected, first check whether the CAPI controllers run in it."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/internet-egress-unavailable/?INSTALLATION=myinstall&CLUSTER=myinstall"
            exp_labels:
              alertname: "ClusterInternetEgressUnavailable"
              area: platform
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_metrics_broken: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "false"
              cluster_id: "myinstall"
              cluster_type: "management_cluster"
              installation: "myinstall"
              pipeline: "stable"
              provider: "$provider"
              severity: "page"
              target: "egress-github"
              team: "cabbage"
              topic: "network"

  # Single-node background noise on one of the additional targets must stay quiet, same as for
  # http-giantswarm. 1 of 8 = 12.5%.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-registry", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-registry", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-registry", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-registry", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-3"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-registry", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-4"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-registry", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-5"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-registry", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-6"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-registry", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-7"}'
        values: "1x60"
    alert_rule_test:
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts: []

  # Healthy cluster - no alert.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-3"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-4"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-5"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-6"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-7"}'
        values: "1x60"
    alert_rule_test:
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts: []

  # A workload cluster gets the plain description, without the hint about
  # the CAPI controllers, which only run on management clusters.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="mywc", cluster_type="workload_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="mywc", cluster_type="workload_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "1x60"
    alert_rule_test:
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts:
          - exp_annotations:
              description: "50% of nodes on myinstall/mywc cannot reach http-giantswarm."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/internet-egress-unavailable/?INSTALLATION=myinstall&CLUSTER=mywc"
            exp_labels:
              alertname: "ClusterInternetEgressUnavailable"
              area: platform
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_metrics_broken: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "false"
              cluster_id: "mywc"
              cluster_type: "workload_cluster"
              installation: "myinstall"
              pipeline: "stable"
              provider: "$provider"
              severity: "page"
              target: "http-giantswarm"
              team: "cabbage"
              topic: "network"

  # Series without a cluster_type label still page, with the plain description and no template error.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="mywc", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="mywc", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "1x60"
    alert_rule_test:
      - alertname: ClusterInternetEgressUnavailable
        eval_time: 30m
        exp_alerts:
          - exp_annotations:
              description: "50% of nodes on myinstall/mywc cannot reach http-giantswarm."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/internet-egress-unavailable/?INSTALLATION=myinstall&CLUSTER=mywc"
            exp_labels:
              alertname: "ClusterInternetEgressUnavailable"
              area: platform
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_metrics_broken: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "false"
              cluster_id: "mywc"
              installation: "myinstall"
              pipeline: "stable"
              provider: "$provider"
              severity: "page"
              target: "http-giantswarm"
              team: "cabbage"
              topic: "network"

  # A proxy or customer firewall with a domain allowlist blocks www.giantswarm.io on every node, while the
  # egress- targets that cover what the cluster needs stay green. http-giantswarm only counts on clusters without
  # egress- targets, so nothing may fire (giantswarm/giantswarm#38412).
  - interval: 1m
    input_series:
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="http-giantswarm", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-3"}'
        values: "0x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-github", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-0"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-github", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-1"}'
        values: "1x60"
      - series: 'probe_success{job="prometheus-blackbox-exporter", target="egress-github", cluster_id="myinstall", cluster_type="management_cluster", installation="myinstall", pipeline="stable", provider="$provider", namespace="kube-system", pod="blackbox-2"}'
        values: "1x60"
