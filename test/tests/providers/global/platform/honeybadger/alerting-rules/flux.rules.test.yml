---
rule_files:
  - flux.rules.yml

tests:
  - interval: 1m
    input_series:
      - series: 'gotk_resource_info{ready="False", job="flux-ksm", customresource_kind="Kustomization", cluster_type="management_cluster", exported_namespace="flux-giantswarm", name="silences"}'
        values: "1x60"
    alert_rule_test:
      - alertname: FluxKustomizationFailed
        eval_time: 30m
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'gotk_resource_info{installation="test", job="flux-ksm", cluster_type="management_cluster", exported_namespace="flux-giantswarm", customresource_kind="Kustomization", name="flux", suspended="true"}'
        values: "1x60 0+1x60 1+0x1500"
    alert_rule_test:
      - alertname:  FluxSuspendedForTooLong
        eval_time: 1560m
        exp_alerts:
          - exp_labels:
              alertname: "FluxSuspendedForTooLong"
              area: platform
              cancel_if_outside_working_hours: "true"
              cluster_type: "management_cluster"
              customresource_kind: "Kustomization"
              exported_namespace: "flux-giantswarm"
              installation: "test"
              job: "flux-ksm"
              name: "flux"
              severity: "page"
              suspended: "true"
              team: "honeybadger"
              topic: "releng"
            exp_annotations:
              description: "Flux Kustomization flux in ns flux-giantswarm on test has been suspended for 24h."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-suspended/?INSTALLATION=test&CLUSTER="

  # giantswarm#37456 - a giantswarm-namespace source stuck in Failed state must page. Per-source, so the
  # failing source is named; the aggregated form was dropped once the namespace widening was reverted.
  - interval: 1m
    input_series:
      - series: 'gotk_resource_info{installation="myinstall", cluster_id="myinstall", pipeline="stable", provider="$provider", job="flux-ksm", cluster_type="management_cluster", exported_namespace="flux-giantswarm", customresource_kind="GitRepository", name="giantswarm-config", ready="False"}'
        values: "1x60"
    alert_rule_test:
      # not yet firing before `for: 30m` has elapsed
      - alertname: FluxSourceFailed
        eval_time: 25m
        exp_alerts: []
      - alertname: FluxSourceFailed
        eval_time: 35m
        exp_alerts:
          - exp_labels:
              alertname: "FluxSourceFailed"
              area: platform
              cancel_if_kube_state_metrics_down: "true"
              cancel_if_metrics_broken: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "false"
              cluster_id: "myinstall"
              cluster_type: "management_cluster"
              customresource_kind: "GitRepository"
              exported_namespace: "flux-giantswarm"
              installation: "myinstall"
              job: "flux-ksm"
              name: "giantswarm-config"
              pipeline: "stable"
              provider: "$provider"
              ready: "False"
              severity: "page"
              team: "honeybadger"
              topic: "releng"
            exp_annotations:
              description: "Flux GitRepository giantswarm-config in ns flux-giantswarm on myinstall/myinstall is stuck in Failed state."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-source-failed/?INSTALLATION=myinstall&CLUSTER=myinstall&NAMESPACE=flux-giantswarm&SOURCE_NAME=giantswarm-config"

  # Customer-namespace sources are deliberately out of scope: they are a living system that fails routinely
  # and harmlessly, and during giantswarm#37391 no source failed in any namespace anyway. This must stay quiet.
  - interval: 1m
    input_series:
      - series: 'gotk_resource_info{installation="myinstall", cluster_id="myinstall", pipeline="stable", provider="$provider", job="flux-ksm", cluster_type="management_cluster", exported_namespace="default", customresource_kind="GitRepository", name="team-apps", ready="False"}'
        values: "1x60"
      - series: 'gotk_resource_info{installation="myinstall", cluster_id="myinstall", pipeline="stable", provider="$provider", job="flux-ksm", cluster_type="management_cluster", exported_namespace="org-customer", customresource_kind="GitRepository", name="team-config", ready="False"}'
        values: "1x60"
    alert_rule_test:
      - alertname: FluxSourceFailed
        eval_time: 35m
        exp_alerts: []

  # Flux uptime. source-controller publishes this metric itself; gotk_resource_info comes from the flux-ksm
  # kube-state-metrics instance, so it reports KSM's health rather than Flux's.
  - interval: 1m
    input_series:
      - series: 'gotk_reconcile_duration_seconds_count{installation="myinstall", cluster_id="myinstall", pipeline="stable", provider="$provider", job="flux-giantswarm/source-controller", cluster_type="management_cluster", kind="GitRepository", name="giantswarm-config"}'
        values: "1x30"
    alert_rule_test:
      # metrics still arriving
      - alertname: FluxMetricsMissing
        eval_time: 20m
        exp_alerts: []
      # series stops after 30m; fires once `for: 30m` has elapsed on top of that
      - alertname: FluxMetricsMissing
        eval_time: 75m
        exp_alerts:
          - exp_labels:
              alertname: "FluxMetricsMissing"
              area: platform
              cancel_if_metrics_broken: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              cluster_id: "myinstall"
              cluster_type: "management_cluster"
              installation: "myinstall"
              job: "flux-giantswarm/source-controller"
              pipeline: "stable"
              provider: "$provider"
              severity: "page"
              team: "honeybadger"
              topic: "releng"
            exp_annotations:
              description: "Flux is not reconciling on myinstall: no reconcile metrics from source-controller."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-metrics-missing/?INSTALLATION=myinstall&CLUSTER=myinstall"

  # giantswarm#37456 - noise guard. On a large customer MC, 2-4 customer Kustomizations are chronically
  # `ready="False"` and 5-21 are chronically `suspended`, every day. Neither may ever page.
  # interval must stay <= the 5m lookback delta, otherwise the series goes stale between rule evaluations
  # and the `for:` timer resets instead of accumulating.
  - interval: 5m
    input_series:
      - series: 'gotk_resource_info{installation="myinstall", cluster_id="myinstall", pipeline="stable", provider="$provider", job="flux-ksm", cluster_type="management_cluster", exported_namespace="default", customresource_kind="Kustomization", name="team-workloads", ready="False"}'
        values: "1x2160"
      - series: 'gotk_resource_info{installation="myinstall", cluster_id="myinstall", pipeline="stable", provider="$provider", job="flux-ksm", cluster_type="management_cluster", exported_namespace="default", customresource_kind="Kustomization", name="team-config", suspended="true", ready="True"}'
        values: "1x2160"
    alert_rule_test:
      # a failing customer Kustomization must not page - that is a customer concern, not an egress signal
      - alertname: FluxKustomizationFailed
        eval_time: 100h
        exp_alerts: []
      # suspended for 48h is normal on a customer MC - must stay quiet
      - alertname: FluxCustomerSuspendedForTooLong
        eval_time: 48h
        exp_alerts: []
      # suspended for over 7d becomes a Slack notification (severity: notify), never a page
      - alertname: FluxCustomerSuspendedForTooLong
        eval_time: 175h
        exp_alerts:
          - exp_labels:
              alertname: "FluxCustomerSuspendedForTooLong"
              area: platform
              cancel_if_kube_state_metrics_down: "true"
              cancel_if_metrics_broken: "true"
              cancel_if_monitoring_agent_down: "true"
              cancel_if_outside_working_hours: "true"
              cluster_id: "myinstall"
              customresource_kind: "Kustomization"
              exported_namespace: "default"
              installation: "myinstall"
              pipeline: "stable"
              provider: "$provider"
              severity: "notify"
              team: "honeybadger"
              topic: "releng"
            exp_annotations:
              description: "1 Flux Kustomization(s) in ns default on myinstall have been suspended for 7 days."
              runbook_url: "https://intranet.giantswarm.io/docs/support-and-ops/runbooks/flux-suspended/?INSTALLATION=myinstall&CLUSTER=myinstall"
