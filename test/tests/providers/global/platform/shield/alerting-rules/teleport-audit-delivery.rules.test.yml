---
rule_files:
  - teleport-audit-delivery.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # wc1: live cluster whose probe stream dies at t=60m.
      - series: 'capi_cluster_status_condition{app="kube-state-metrics", type="ControlPlaneReady", status="True", name="wc1", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "1x180"
      - series: 'capi_cluster_status_phase{app="kube-state-metrics", phase="Deleting", name="wc1", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "0x180"
      # wc2: healthy cluster with one probe every 15m.
      - series: 'capi_cluster_status_condition{app="kube-state-metrics", type="ControlPlaneReady", status="True", name="wc2", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "1x180"
      - series: 'capi_cluster_status_phase{app="kube-state-metrics", phase="Deleting", name="wc2", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "0x180"
      # wc3: cluster being deleted, no probe metric.
      - series: 'capi_cluster_status_condition{app="kube-state-metrics", type="ControlPlaneReady", status="True", name="wc3", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "1x180"
      - series: 'capi_cluster_status_phase{app="kube-state-metrics", phase="Deleting", name="wc3", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "1x180"
      # wc4: fresh cluster, first probe arrives at t=35m.
      - series: 'capi_cluster_status_condition{app="kube-state-metrics", type="ControlPlaneReady", status="True", name="wc4", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "1x180"
      - series: 'capi_cluster_status_phase{app="kube-state-metrics", phase="Deleting", name="wc4", installation="myinstall", pipeline="stable", provider="$provider"}'
        values: "0x180"
      - series: 'giantswarm:teleport_audit:probe_events:count_15m{cluster_id="wc1", installation="myinstall", pipeline="stable"}'
        values: "3x75"
      - series: 'giantswarm:teleport_audit:probe_events:count_15m{cluster_id="wc2", installation="myinstall", pipeline="stable"}'
        values: "3 _x14 3 _x14 3 _x14 3 _x14 3 _x14 3 _x14 3 _x14 3 _x14 3 _x14 3 _x14 3 _x14 3 _x14"
      - series: 'giantswarm:teleport_audit:probe_events:count_15m{cluster_id="wc4", installation="myinstall", pipeline="stable"}'
        values: "_x35 3x145"
    alert_rule_test:
      # Fresh-cluster grace: wc4's inventory is 34m old but should not fire due to the grace period.
      - alertname: TeleportAuditProbeMissing
        eval_time: 34m
        exp_alerts: []
      # Steady state: all live clusters covered, wc3 (Deleting) suppressed.
      - alertname: TeleportAuditProbeMissing
        eval_time: 50m
        exp_alerts: []
      # Test that wc1 does not start pending until 40 mins after its last probe event at 60m.
      - alertname: TeleportAuditProbeMissing
        eval_time: 100m
        exp_alerts: []
      # Test that wc1 pending since ~110m shouldn't fire before ~150m.
      - alertname: TeleportAuditProbeMissing
        eval_time: 145m
        exp_alerts: []
      # Test that wc1 fires after the grace period has passed. Other clusters should not fire.
      - alertname: TeleportAuditProbeMissing
        eval_time: 155m
        exp_alerts:
          - exp_labels:
              area: platform
              cancel_if_cluster_has_no_workers: "true"
              cancel_if_outside_working_hours: "true"
              cluster_id: wc1
              installation: myinstall
              pipeline: stable
              provider: $provider
              severity: page
              team: shield
              topic: observability
            exp_annotations:
              description: 'No Teleport audit events from cluster wc1 (installation myinstall) reached its Loki for 45m — audit log delivery for this cluster is broken.'
              runbook_url: 'https://intranet.giantswarm.io/docs/support-and-ops/runbooks/teleport-audit-log-delivery/?INSTALLATION=myinstall&CLUSTER=wc1'
